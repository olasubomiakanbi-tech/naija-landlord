/* =====================================================================
   ONLINE PLAY FOR THE STANDALONE WEB APP
   Rooms run over a public MQTT relay (WebSockets). The host's browser is
   the referee: it applies every move with the rules engine and publishes
   the game state; everyone else sends their moves to the host.
   These function declarations replace the claude.ai storage versions.
   ===================================================================== */
const NET = {
  broker: (new URLSearchParams(location.search)).get('broker') || 'wss://broker.emqx.io:8084/mqtt',
  prefix: 'naijalandlord/v2/',
  client: null, connected: false, ready: null,
  roomTopics: [], lobby: new Map(), lobbySub: false,
  hostOnline: true, presenceSub: null, actSub: false, joinWait: null,
};

function myId() {
  let id = LS.get('nl-id');
  if (!id) { id = 'u' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); LS.set('nl-id', id); }
  return id;
}

function netConnect() {
  if (NET.ready) return NET.ready;
  NET.ready = new Promise(resolve => {
    if (!window.mqtt) { resolve(false); return; }
    const c = window.mqtt.connect(NET.broker, {
      clientId: 'nl_' + ui.me + '_' + TAB_ID, clean: true, keepalive: 30,
      reconnectPeriod: 2500, connectTimeout: 10000,
      will: { topic: NET.prefix + 'presence/' + ui.me, payload: '0', retain: true, qos: 0 },
    });
    NET.client = c;
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    c.on('connect', () => {
      NET.connected = true;
      c.publish(NET.prefix + 'presence/' + ui.me, '1', { retain: true });
      // re-subscribe after reconnects
      NET.roomTopics.forEach(t => c.subscribe(t));
      if (NET.lobbySub) c.subscribe(NET.prefix + 'lobby/+');
      if (NET.presenceSub) c.subscribe(NET.prefix + 'presence/' + NET.presenceSub);
      finish(true);
      if (ui.screen === 'online') renderOnline();
    });
    c.on('close', () => { NET.connected = false; });
    c.on('offline', () => { NET.connected = false; });
    c.on('error', () => {});
    c.on('message', onNetMessage);
    setTimeout(() => finish(false), 11000);
  });
  return NET.ready;
}

function pub(topic, obj, retain) {
  if (!NET.client) return;
  NET.client.publish(NET.prefix + topic, obj == null ? '' : JSON.stringify(obj), { retain: !!retain, qos: 1 });
}
function sub(topic) {
  const t = NET.prefix + topic;
  if (!NET.roomTopics.includes(t)) NET.roomTopics.push(t);
  if (NET.client) NET.client.subscribe(t, { qos: 1 });
}

function onNetMessage(topic, buf) {
  if (!topic.startsWith(NET.prefix)) return;
  const t = topic.slice(NET.prefix.length).split('/');
  const txt = buf.toString();
  let data = null;
  if (txt && txt !== '0' && txt !== '1') { try { data = JSON.parse(txt); } catch (e) { return; } }

  if (t[0] === 'lobby') {
    if (!data) NET.lobby.delete(t[1]); else NET.lobby.set(t[1], data);
    if (ui.screen === 'online') { ui.rooms = lobbyRooms(); updateRoomList(); }
    return;
  }
  if (t[0] === 'presence') {
    if (ui.state && t[1] === ui.state.hostId) { NET.hostOnline = txt !== '0'; rerenderNet(); }
    return;
  }
  if (t[0] !== 'room' || t[1] !== ui.code) return;
  if (t[2] === 'state' && data) {
    if (ui.state && data.seq < ui.state.seq && data.hostId === ui.state.hostId) return;
    if (ui.state && data.seq === ui.state.seq && data.updatedAt === ui.state.updatedAt) return;
    clearTimeout(NET.joinWait);
    afterState(data);
    setState(data);
    return;
  }
  if (t[2] === 'act' && data) { hostHandle(data); return; }
  if (t[2] === 'music' && data) {
    music.lastRoomTrack = data;
    if (!ui.state || ui.state.hostId !== ui.me) followTrack(data);
    return;
  }
  if (t[2] === 'err' && t[3] === ui.me && data) { toast(data.error, true); return; }
}

/* the host applies moves */
function hostHandle(msg) {
  const s = ui.state;
  if (!s || s.hostId !== ui.me || !msg || !msg.a || !msg.from) return;
  const r = reduce(s, Object.assign({}, msg.a, { actor: msg.from, now: Date.now() }));
  if (r.error) { if (!msg.quiet) pub('room/' + s.code + '/err/' + msg.from, { error: r.error }); return; }
  commit(r.state);
}
function lobbyRecord(s) {
  if (!s || s.settings.public === false || s.status === 'ended') return null;
  return { code: s.code, status: s.status, players: s.players.filter(p => !p.bankrupt).map(p => ({ name: p.name, token: p.token })),
    settings: { board: s.settings.board, maxPlayers: s.settings.maxPlayers }, updatedAt: Date.now() };
}
function publishLobby(s, force) {
  const rec = lobbyRecord(s);
  const key = rec ? JSON.stringify([rec.status, rec.players, rec.settings]) : 'none';
  if (!force && key === NET.lobbyKey) return;
  if (!rec && NET.lobbyKey === 'none' && !force) return;
  NET.lobbyKey = key;
  pub('lobby/' + s.code, rec, true);
}
/* the host re-announces a public room every 40s so the list only shows rooms that are really open */
setInterval(() => {
  const s = ui.state;
  if (s && ui.mode === 'online' && s.hostId === ui.me && NET.connected) publishLobby(s, true);
}, 40000);
function commit(s) {
  pub('room/' + s.code + '/state', s, true);
  publishLobby(s, false);
  /* finished or closed rooms are wiped from the relay so nobody can reopen them */
  if (s.status === 'ended' || s.status === 'closed') { pub('room/' + s.code + '/state', null, true); pub('lobby/' + s.code, null, true); }
  afterState(s);
  setState(s);
}

/* keep subscriptions in line with who is hosting */
function afterState(s) {
  if (s.hostId === ui.me && music.follow) { music.follow = false; }
  if (s.hostId === ui.me && NET.musicFor !== s.code) { NET.musicFor = s.code; const tr = musicCurrent(); if (tr) pub('room/' + s.code + '/music', tr, true); }
  if (s.hostId !== ui.me) NET.musicFor = null;
  if (s.hostId === ui.me && !NET.actSub) { sub('room/' + s.code + '/act'); NET.actSub = true; }
  if (s.hostId !== ui.me && NET.actSub) { const t = NET.prefix + 'room/' + s.code + '/act'; NET.client && NET.client.unsubscribe(t); NET.roomTopics = NET.roomTopics.filter(x => x !== t); NET.actSub = false; }
  if (NET.presenceSub !== s.hostId) {
    if (NET.presenceSub && NET.client) NET.client.unsubscribe(NET.prefix + 'presence/' + NET.presenceSub);
    NET.presenceSub = s.hostId; NET.hostOnline = true;
    if (NET.client) NET.client.subscribe(NET.prefix + 'presence/' + s.hostId);
  }
  if (NET.pendingJoin && s.status === 'lobby' && !s.playerIds.includes(ui.me)) {
    const pj = NET.pendingJoin; NET.pendingJoin = null;
    if (s.players.length >= s.settings.maxPlayers) toast('That room is full. You are watching.', true);
    else pub('room/' + s.code + '/act', { a: { type: 'join', by: ui.me, name: pj.name, token: pj.token }, from: ui.me });
  } else if (NET.pendingJoin && s.status !== 'lobby' && !s.playerIds.includes(ui.me)) {
    NET.pendingJoin = null; toast('This game has already started. You are watching.');
  }
}

function rerenderNet() {
  if (ui.screen === 'game') renderCenter();
  else if (ui.screen === 'lobby' && ui.state) renderLobby(ui.state);
}

/* ---------- overrides of the claude.ai versions ---------- */
async function initCaps() {
  ui.me = myId();
  await netConnect();
  ui.capsReady = true;
  if (ui.screen === 'online') { renderOnline(); loadRooms(); }
}
function onlineOK() { return !!(NET.connected && ui.me); }
function onlineMsg() {
  if (!ui.capsReady) return 'Connecting to the game server…';
  if (!NET.connected) return 'Could not reach the game server. Check your internet connection and reload. You can still play on this device.';
  return '';
}
function lobbyNote(code) {
  return `Share the code <b>${esc(code)}</b>, or send this link: <b>${esc(location.origin + location.pathname)}#${esc(code)}</b>. Keep this page open while you host; the game runs from your device.`;
}
function hostBanner() {
  const s = ui.state;
  if (!s || ui.mode !== 'online' || s.hostId === ui.me || NET.hostOnline) return '';
  const canTake = s.playerIds.includes(ui.me) && s.status !== 'ended';
  return `<div class="note" style="background:rgba(0,0,0,.35);color:#fff;border-color:var(--danfo)">The host has gone offline. ${canTake ? 'Wait for them, or take over and run the game from your device.' : 'Waiting for them to come back.'}
    ${canTake ? '<div style="margin-top:8px"><button class="btn primary small" data-net="takeover">Take over as host</button></div>' : ''}</div>`;
}
function musicRoomBroadcast(tr) {
  const s = ui.state;
  if (!tr || !s || ui.mode !== 'online' || s.hostId !== ui.me || s.status === 'ended' || s.status === 'closed') return;
  pub('room/' + s.code + '/music', tr, true);
}
function roomGone(code) {
  if (!code) return;
  pub('room/' + code + '/music', null, true);
  pub('room/' + code + '/state', null, true);
  pub('lobby/' + code, null, true);
}
EMBEDS_OK = true;
function dbErr() { return 'Could not reach the game server. Check your connection and try again.'; }

function lobbyRooms() {
  const cutoff = Date.now() - 150000;
  return Array.from(NET.lobby.values()).filter(r => r && r.updatedAt > cutoff && (r.status === 'lobby' || r.status === 'playing') && BOARDS[(r.settings || {}).board] && Array.isArray(r.players))
    .map(r => Object.assign({ mine: false }, r))
    .sort((a, b) => (a.status === 'lobby' ? 0 : 1) - (b.status === 'lobby' ? 0 : 1) || b.updatedAt - a.updatedAt).slice(0, 30);
}
async function loadRooms() {
  if (!onlineOK()) return;
  if (!NET.lobbySub) { NET.lobbySub = true; NET.client.subscribe(NET.prefix + 'lobby/+'); }
  ui.rooms = lobbyRooms();
  updateRoomList();
  setTimeout(() => { if (ui.screen === 'online') { ui.rooms = lobbyRooms(); updateRoomList(); } }, 1500);
}

async function createRoom() {
  if (!onlineOK()) return;
  const me = readMe();
  if (!me.name || me.name === 'Player') { toast('Type your name first.', true); $('#myName') && $('#myName').focus(); return; }
  const code = makeCode();
  let s = newGame({ mode: 'online', code, hostId: ui.me, settings: ui.createSettings });
  s = reduce(s, { type: 'join', by: ui.me, actor: ui.me, name: me.name, token: me.token }).state;
  await enterRoom(code, true);
  commit(s);
}
async function joinRoom(code) {
  if (!onlineOK()) { toast('Still connecting to the game server…', true); return; }
  code = String(code || '').trim().toUpperCase();
  if (!/^[A-Z0-9]{4,6}$/.test(code)) { toast('Type the 5-letter room code.', true); return; }
  const me = readMe();
  if (!me.name || me.name === 'Player') { toast('Type your name first.', true); $('#myName') && $('#myName').focus(); return; }
  await enterRoom(code, false);
  NET.pendingJoin = me;
}
async function watchRoom(code) {
  if (!onlineOK()) { toast('Still connecting to the game server…', true); return; }
  readMe();
  await enterRoom(code, false);
}
async function enterRoom(code, creating) {
  stopOnline();
  ui.mode = 'online'; ui.code = code; ui.state = null; ui.shown = null;
  ui.view = { pos: {}, dice: [3, 4], rollSeq: -1, fxSeq: -1, cardSeq: -1, winShown: null, first: true };
  ui.actor = null; ui.draft = null; ui.tab = 'props';
  NET.actSub = false; NET.hostOnline = true; NET.lobbyKey = null;
  if (NET.client) NET.client.publish(NET.prefix + 'presence/' + ui.me, '1', { retain: true });
  LS.set('nl-last-room', code);
  try { history.replaceState(null, '', '#' + code); } catch (e) {}
  app().innerHTML = `<section class="page screen"><div class="topbar"><button class="btn ghost small" data-act="lobby-leave">← Back</button><h1>Room ${esc(code)}</h1></div><div class="note">Opening room ${esc(code)}…</div></section>`;
  sub('room/' + code + '/state');
  sub('room/' + code + '/music');
  sub('room/' + code + '/err/' + ui.me);
  if (!creating) {
    NET.joinWait = setTimeout(() => {
      if (!ui.state && ui.code === code) { toast('No room with that code.', true); stopOnline(); LS.del('nl-last-room'); showOnline(); }
    }, 8000);
  }
}
function stopOnline() {
  const s = ui.state;
  if (s && ui.mode === 'online' && s.hostId === ui.me && s.status === 'lobby') pub('lobby/' + s.code, null, true);
  if (s && ui.mode === 'online' && s.hostId === ui.me && NET.client) NET.client.publish(NET.prefix + 'presence/' + ui.me, '0', { retain: true });
  if (NET.client) NET.roomTopics.forEach(t => NET.client.unsubscribe(t));
  NET.roomTopics = []; NET.actSub = false; NET.pendingJoin = null; NET.musicFor = null;
  music.follow = false; music.lastRoomTrack = null;
  clearTimeout(NET.joinWait);
  if (NET.presenceSub && NET.client) NET.client.unsubscribe(NET.prefix + 'presence/' + NET.presenceSub);
  NET.presenceSub = null;
  if (ui.mode === 'online') { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
}
async function onlineDispatch(a) {
  const s = ui.state;
  if (!s) return { error: 'Not in a room.' };
  if (s.hostId === ui.me) {
    const r = reduce(s, Object.assign({}, a, { actor: ui.me, now: Date.now() }));
    if (r.error) return r;
    commit(r.state);
    return r;
  }
  pub('room/' + s.code + '/act', { a, from: ui.me, quiet: a.type === 'auctionEnd' });
  return {};
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-net]');
  if (!b) return;
  if (b.dataset.net === 'takeover') {
    const s = ui.state; if (!s) return;
    const n = JSON.parse(JSON.stringify(s));
    n.hostId = ui.me; n.seq = (n.seq || 0) + 1; n.updatedAt = Date.now();
    n.log.push({ t: Date.now(), m: `${(P(n, ui.me) || {}).name || 'A player'} took over as host.` });
    commit(n);
    toast('You are now hosting this game. Keep this page open.');
  }
});

/* open a room straight from a shared link like …/#ABCDE */
window.addEventListener('load', () => {
  const code = (location.hash || '').slice(1).toUpperCase();
  if (/^[A-Z0-9]{5}$/.test(code)) {
    LS.set('nl-last-room', code);
    const go = () => { showOnline(); const j = $('#joinCode'); if (j) j.value = code; };
    setTimeout(go, 50);
  }
});

window.claude && window.claude.hot && window.claude.hot.ready ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script></body></html>
