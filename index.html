<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Naija Landlord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: a game table — players | board | controls on wide screens; board first, then stacked panels on phones.
   Look: adire-indigo night, danfo-yellow controls, flag-green board felt. Single committed dark look. */
:root{
  --ink:#0E1130; --ink-2:#161A45; --ink-3:#20255C; --ink-4:#2B3172; --line:#323A80;
  --fg:#F5F2E9; --muted:#AAB0DA; --faint:#7C83B8;
  --danfo:#F7C21A; --danfo-2:#FFD84D; --black:#141414;
  --naija:#0B8A4E; --naija-deep:#065A33; --naija-dark:#043A22;
  --tile:#FBF7EC; --tile-2:#F1EAD6; --tile-ink:#1A1D3B;
  --bad:#FF5C61; --good:#3DD68C; --wahala:#E2482F; --ajo:#0F8F57;
  --f-display:'Bungee', Impact, 'Arial Black', system-ui, sans-serif;
  --f-body:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:12px;
  color-scheme: dark;
}
html,body{height:100%}
body{
  margin:0; background-color:var(--ink); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.45;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(140,150,255,.09) 0 2.5px, transparent 3.5px),
    radial-gradient(circle at 0 0, rgba(140,150,255,.06) 0 9px, transparent 10px),
    repeating-linear-gradient(45deg, rgba(140,150,255,.035) 0 1px, transparent 1px 13px),
    repeating-linear-gradient(-45deg, rgba(140,150,255,.035) 0 1px, transparent 1px 13px);
  background-size: 26px 26px, 52px 52px, auto, auto;
  background-attachment: fixed;
}
*{box-sizing:border-box}
button,input,select{font:inherit; color:inherit}
h1,h2,h3{text-wrap:balance; margin:0}
:focus-visible{outline:3px solid var(--danfo); outline-offset:2px}
.screen{min-height:100%}

/* ---------- buttons ---------- */
.btn{appearance:none; border:0; cursor:pointer; background:var(--ink-4); color:var(--fg); font-weight:700;
  padding:.62em 1.05em; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; gap:.45em;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.28); transition: transform .08s, filter .15s; white-space:nowrap; font-size:.95rem}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42; cursor:not-allowed}
.btn.primary{background:var(--danfo); color:var(--black); box-shadow: inset 0 -5px 0 var(--black), 0 6px 18px rgba(247,194,26,.18)}
.btn.green{background:var(--naija); color:#fff; box-shadow: inset 0 -4px 0 var(--naija-dark)}
.btn.danger{background:#5A1E2E; color:#FFC9CB}
.btn.ghost{background:transparent; box-shadow:none; border:1.5px solid var(--line); color:var(--muted)}
.btn.small{padding:.38em .7em; font-size:.82rem; border-radius:8px}
.btn.big{padding:.85em 1.4em; font-size:1.05rem}
.btn.block{width:100%}

/* ---------- forms ---------- */
.field{display:grid; gap:.3rem}
.field label, .lbl{font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700}
.input{background:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:.6em .8em; width:100%; min-width:0}
.input:focus{border-color:var(--danfo); outline:none}
.toggle{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:.6rem 0; border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle b{display:block; font-size:.93rem}
.toggle small{color:var(--muted); font-size:.8rem}
.switch{position:relative; flex:none; width:44px; height:26px}
.switch input{opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; z-index:1}
.switch span{position:absolute; inset:0; background:var(--ink); border:1.5px solid var(--line); border-radius:99px; transition:.15s}
.switch span::after{content:''; position:absolute; top:3px; left:3px; width:17px; height:17px; border-radius:50%; background:var(--faint); transition:.15s}
.switch input:checked + span{background:var(--naija); border-color:var(--naija)}
.switch input:checked + span::after{left:21px; background:#fff}
.switch input:disabled{cursor:not-allowed}
.seg{display:inline-flex; background:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:3px; gap:3px; flex-wrap:wrap}
.seg button{border:0; background:transparent; padding:.4em .8em; border-radius:7px; cursor:pointer; color:var(--muted); font-weight:700; font-size:.88rem}
.seg button.on{background:var(--danfo); color:var(--black)}
.seg button:disabled{cursor:not-allowed}

/* ---------- home ---------- */
.home{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:32px 48px; display:grid; gap:34px}
.hero{display:grid; grid-template-columns: minmax(0,1.05fr) minmax(0,1fr); gap:40px; align-items:center}
.wordmark{font-family:var(--f-display); line-height:.92; font-size:clamp(2.6rem, 7vw, 5.4rem); letter-spacing:.01em}
.wordmark .w1{color:var(--fg); display:block}
.wordmark .w2{display:inline-block; background:var(--danfo); color:var(--black); padding:.06em .18em .02em; margin-top:.08em;
  box-shadow: 0 .14em 0 var(--black), 0 .26em 0 var(--danfo); transform:rotate(-1.5deg)}
.tagline{font-size:1.12rem; color:var(--muted); max-width:46ch; margin-top:26px}
.flagbar{display:flex; height:6px; width:120px; border-radius:3px; overflow:hidden; margin-top:36px}
.flagbar i{flex:1; background:var(--naija)} .flagbar i:nth-child(2){background:#fff}
.preview-wrap{justify-self:center; width:min(100%, 470px); transform: perspective(1200px) rotateX(16deg) rotateZ(-4deg); filter: drop-shadow(0 30px 40px rgba(0,0,0,.5))}
.modes{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px}
.mode{background:var(--ink-2); border:1.5px solid var(--line); border-radius:18px; padding:24px; display:grid; gap:14px; align-content:start}
.mode h2{font-family:var(--f-display); font-size:1.5rem; font-weight:400}
.mode p{margin:0; color:var(--muted)}
.mode .row{display:flex; gap:10px; flex-wrap:wrap}
.mode .kicker{font-size:.74rem; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:var(--danfo)}
.facts{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px}
.fact{border-top:2px solid var(--line); padding-top:10px}
.fact b{font-family:var(--f-display); font-weight:400; font-size:1.05rem; display:block}
.fact span{color:var(--muted); font-size:.88rem}

/* ---------- setup / lobby ---------- */
.page{max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:24px 48px; display:grid; gap:20px}
.topbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.topbar h1{font-family:var(--f-display); font-weight:400; font-size:clamp(1.4rem, 3.5vw, 2rem)}
.topbar .sp{flex:1}
.cols{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:20px; align-items:start}
.card{background:var(--ink-2); border:1.5px solid var(--line); border-radius:16px; padding:20px; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; min-width:0}
.card h3{font-size:1.05rem}
.prow{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:10px; background:var(--ink); border-radius:12px; border:1.5px solid var(--line)}
.tok-pick{display:flex; gap:4px; flex-wrap:wrap}
.tok-pick button{width:34px; height:34px; border-radius:9px; border:1.5px solid var(--line); background:var(--ink-2); cursor:pointer; font-size:18px; display:grid; place-items:center; padding:0}
.tok-pick button.on{border-color:var(--danfo); background:var(--ink-4)}
.tok-pick button:disabled{opacity:.25; cursor:not-allowed}
.chip{display:inline-flex; align-items:center; gap:.3em; font-size:.72rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:.18em .5em; border-radius:6px; background:var(--ink-4); color:var(--muted)}
.chip.y{background:var(--danfo); color:var(--black)} .chip.g{background:var(--naija); color:#fff} .chip.r{background:#5A1E2E; color:#FFC9CB}
.avatar{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:20px; background:var(--tile); border:3px solid var(--pc, var(--danfo)); flex:none}
.code{font-family:var(--f-display); font-size:clamp(2rem, 6vw, 3rem); letter-spacing:.12em; color:var(--danfo)}
.rooms{display:grid; gap:8px}
.room{display:flex; align-items:center; gap:12px; min-width:0; padding:10px 12px; background:var(--ink); border:1.5px solid var(--line); border-radius:12px}
.room .grow{flex:1; min-width:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.note{background:var(--ink); border:1.5px dashed var(--line); border-radius:12px; padding:12px 14px; color:var(--muted); font-size:.9rem}

/* ---------- game layout ---------- */
#game{display:grid; grid-template-columns: 260px minmax(0,1fr) 350px; gap:16px; height:100%; padding-inline:16px; padding-block:12px}
#game > *{min-width:0; min-height:0}
.scrollzone{display:contents}
#leftPane{grid-column:1; grid-row:1} #boardWrap{grid-column:2; grid-row:1} #rightPane{grid-column:3; grid-row:1}
.pane{display:flex; flex-direction:column; gap:12px; overflow:auto; scrollbar-width:thin; overscroll-behavior:contain}
body.in-game{overflow:hidden}
body.in-game #game{height:100svh; height:100dvh}
.seg.lvl button{font-size:.8rem; padding:.35em .65em}
.gbar{display:flex; align-items:center; gap:8px}
.gbar .mini{font-family:var(--f-display); font-size:1rem; line-height:1}
.gbar .mini span{background:var(--danfo); color:var(--black); padding:0 .2em}
.gbar .sp{flex:1}
.iconbtn{width:36px; height:36px; border-radius:10px; border:1.5px solid var(--line); background:var(--ink-2); cursor:pointer; display:grid; place-items:center; padding:0}
.iconbtn svg{width:18px; height:18px}
#boardWrap{display:flex; align-items:center; justify-content:center}

/* players */
.plist{display:grid; gap:8px}
.pl{position:relative; background:var(--ink-2); border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; transition:border-color .2s, transform .2s}
.pl.turn{border-color:var(--danfo); box-shadow:0 0 0 3px rgba(247,194,26,.18)}
.pl.turn::before{content:''; position:absolute; left:-1.5px; top:12px; bottom:12px; width:4px; border-radius:0 3px 3px 0; background:var(--danfo)}
.pl.out{opacity:.45}
.pl .nm{font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pl .cash{font-variant-numeric:tabular-nums; font-weight:800; font-size:1.05rem}
.pl .cash.neg{color:var(--bad)}
.pl .meta{display:flex; gap:4px; flex-wrap:wrap; margin-top:3px}
.sets{display:flex; gap:3px; flex-wrap:wrap; grid-column:1/-1}
.sets i{width:12px; height:8px; border-radius:2px; display:block; opacity:.95}
.pl .kick{grid-column:1/-1; justify-self:end; margin-top:-4px}

/* ---------- board ---------- */
.board{position:relative; aspect-ratio:1/1; width:min(100%, calc(100vh - 24px)); max-width:100%; container-type:inline-size; user-select:none; -webkit-user-select:none}
.board .frame{position:absolute; inset:0; border-radius:16px; background:var(--naija-dark); padding:3px; box-shadow:0 20px 50px rgba(0,0,0,.45), 0 0 0 2px #0a2a1a}
.board .grid{position:absolute; inset:3px; display:grid; gap:2px}
.tile{position:relative; background:var(--tile); color:var(--tile-ink); overflow:hidden; cursor:pointer; border-radius:2px}
.tile:hover{filter:brightness(1.04)}
.tile.owned{background:color-mix(in srgb, var(--own) 20%, var(--tile))}
.tile.hl{box-shadow: inset 0 0 0 3px var(--danfo)}
.t-in{position:absolute; inset:0; display:flex; flex-direction:column; align-items:stretch; text-align:center}
.side-l .t-in, .side-r .t-in{inset:auto; left:50%; top:50%; width:var(--u); height:calc(var(--u) * 1.6)}
.side-l .t-in{transform:translate(-50%,-50%) rotate(90deg)}
.side-r .t-in{transform:translate(-50%,-50%) rotate(-90deg)}
.side-t .t-in{flex-direction:column-reverse}
.band{flex:none; height:24%; background:var(--gc); display:flex; align-items:center; justify-content:center; gap:1px; position:relative; overflow:hidden}
.band::after{content:''; position:absolute; inset:0; opacity:.22; background:
  radial-gradient(circle at 25% 50%, #fff 0 12%, transparent 13%) 0 0/ calc(var(--u)*.34) 100%,
  linear-gradient(90deg, transparent 46%, rgba(0,0,0,.6) 46% 54%, transparent 54%) 0 0/ calc(var(--u)*.34) 100%}
.band .hs{position:relative; z-index:1; display:flex; gap:1px}
.house{width:calc(var(--u)*.15); height:calc(var(--u)*.15); background:#0E7A42; border:1px solid #fff; clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}
.hotel{width:calc(var(--u)*.42); height:calc(var(--u)*.18); background:#D4252D; border:1px solid #fff; border-radius:2px}
.t-art{flex:none; display:flex; justify-content:center; padding-top:2px}
.t-art svg{width:calc(var(--u)*.36); height:calc(var(--u)*.36)}
.tiny .t-art svg{width:calc(var(--u)*.62); height:calc(var(--u)*.62)}
.tiny .t-art{flex:1; align-items:center}
.t-name{flex:1; display:flex; align-items:center; justify-content:center; padding:1px 2px; font-size:calc(var(--u)*.155); line-height:1.08; font-weight:800; overflow:hidden; overflow-wrap:anywhere; hyphens:auto}
.t-price{flex:none; font-size:calc(var(--u)*.16); font-weight:800; padding-bottom:2px; font-variant-numeric:tabular-nums; color:#3c3f60}
.t-ico{flex:none; display:flex; justify-content:center; padding-top:2px}
.t-ico svg{width:calc(var(--u)*.52); height:calc(var(--u)*.52)}
.own{flex:none; height:11%; background:var(--own); display:grid; place-items:center; overflow:hidden; box-shadow:inset 0 1px 0 rgba(0,0,0,.25)}
.own .emb{font-size:calc(var(--u)*.15); line-height:1; filter:drop-shadow(0 1px 0 rgba(255,255,255,.6))}
.tiny .own .emb{display:none}
.hs{align-items:flex-end; justify-content:center; height:100%; padding-bottom:1px}
.hs .hse{width:calc(var(--u)*.22); height:calc(var(--u)*.24); flex:none; filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.hs .htl{width:calc(var(--u)*.78); height:calc(var(--u)*.4); flex:none; filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.plot{display:grid; place-items:center; width:calc(var(--u)*.34); height:calc(var(--u)*.3); background:var(--oc); border:1.5px solid #fff; border-radius:3px; font-size:calc(var(--u)*.19); line-height:1; box-shadow:0 1px 2px rgba(0,0,0,.45); align-self:center}
.hs.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.2) translateY(30%)} 70%{transform:scale(1.25)} 100%{transform:none}}
.tile.mort .t-in > *{opacity:.35}
.tile.mort::after{content:'MORTGAGED'; position:absolute; inset:0; display:grid; place-items:center; font-size:calc(var(--u)*.13); font-weight:800; letter-spacing:.05em; color:#8a1c22; background:repeating-linear-gradient(45deg, rgba(212,37,45,.12) 0 4px, transparent 4px 8px)}
.tile.mort.side-l::after,.tile.mort.side-r::after{writing-mode:vertical-rl}
.compact .t-name{font-size:calc(var(--u)*.17)}
.tiny .t-name{display:none}
.tiny .t-price{font-size:calc(var(--u)*.24); flex:1; display:flex; align-items:center; justify-content:center}
.tiny .t-ico svg{width:calc(var(--u)*.6); height:calc(var(--u)*.6)}
.tiny .band{height:28%}
.corner{display:grid; place-items:center; text-align:center; padding:4px}
.corner .cn{font-family:var(--f-display); font-size:calc(var(--u)*.22); line-height:1; font-weight:400}
.corner .cs{font-size:calc(var(--u)*.13); font-weight:700; color:#555}
.corner svg{width:calc(var(--u)*.85); height:calc(var(--u)*.85)}
.c-go{background:linear-gradient(135deg, #FBF7EC 0 60%, #E7F5EC 60%)}
.c-go .cn{color:var(--naija-deep); font-size:calc(var(--u)*.3)}
.c-jail{background:var(--tile)}
.c-jail .cell{position:absolute; right:0; top:0; width:62%; height:62%; background:#F4A51C; border-left:3px solid #1A1D3B; border-bottom:3px solid #1A1D3B;
  background-image:repeating-linear-gradient(90deg, transparent 0 14%, rgba(26,29,59,.85) 14% 18%); display:grid; place-items:center}
.c-jail .cell b{font-family:var(--f-display); font-weight:400; font-size:calc(var(--u)*.18); background:#F4A51C; padding:0 3px; color:#1A1D3B}
.c-jail .vis{position:absolute; left:4px; bottom:4px; font-size:calc(var(--u)*.13); font-weight:800; color:#555; text-align:left; line-height:1.05}
.c-park{background:radial-gradient(circle at 30% 25%, #FFE58A 0 14%, transparent 15%), radial-gradient(circle at 75% 70%, #F7A8C9 0 10%, transparent 11%), var(--tile)}
.c-park .cn{color:#B3166A}
.corner.long .cn{font-size:calc(var(--u)*.17)}
.corner.long svg{width:calc(var(--u)*.6); height:calc(var(--u)*.6)}
.c-park .pot{font-weight:800; font-size:calc(var(--u)*.2); color:var(--naija-deep)}
.c-gojail .cn{color:#1E3C8C}

/* center felt */
.center{position:absolute; border-radius:6px; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--u)*.22); padding:calc(var(--u)*.35); text-align:center;
  background-color:var(--naija);
  background-image:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 0 18%, transparent 19%),
    conic-gradient(from 45deg at 50% 50%, rgba(0,0,0,.08) 0 25%, transparent 0 50%, rgba(0,0,0,.08) 0 75%, transparent 0),
    radial-gradient(circle at 0 0, rgba(255,216,77,.18) 0 9%, transparent 10%);
  background-size: calc(var(--u)*1.4) calc(var(--u)*1.4);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.25), inset 0 0 60px rgba(0,0,0,.35)}
.c-logo{font-family:var(--f-display); line-height:.9; color:#fff; font-size:calc(var(--u)*.62); text-shadow:0 3px 0 rgba(0,0,0,.35)}
.c-logo span{display:inline-block; background:var(--danfo); color:var(--black); padding:0 .15em; margin-top:.06em; transform:rotate(-2deg); text-shadow:none; box-shadow:0 .1em 0 var(--black)}
.c-status{font-weight:800; color:#fff; font-size:max(13px, calc(var(--u)*.3)); text-shadow:0 1px 0 rgba(0,0,0,.4)}
.c-sub{color:#D7F3E3; font-size:max(12px, calc(var(--u)*.24))}
.c-actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.c-actions .btn{font-size:max(13px, calc(var(--u)*.27))}
.c-pot{display:inline-flex; gap:6px; align-items:center; background:rgba(0,0,0,.25); color:#FFE58A; border-radius:99px; padding:.2em .8em; font-weight:800; font-size:max(12px, calc(var(--u)*.24))}
.tiny .c-logo, .compact .c-logo{display:none}

/* dice */
.dice{display:flex; gap:calc(var(--u)*.35); perspective:600px}
.die{width:calc(var(--u)*.95); height:calc(var(--u)*.95); min-width:30px; min-height:30px; position:relative; transform-style:preserve-3d}
.dice.rolling{animation:rattle var(--roll, 3800ms) cubic-bezier(.3,.1,.3,1)}
@keyframes rattle{0%{transform:translateY(0)} 8%{transform:translate(-14px,-26px) rotate(-8deg)} 18%{transform:translate(12px,6px) rotate(6deg)} 30%{transform:translate(-10px,-18px) rotate(-5deg)} 44%{transform:translate(8px,4px) rotate(4deg)} 58%{transform:translate(-6px,-10px) rotate(-3deg)} 72%{transform:translate(4px,2px)} 86%{transform:translate(-2px,-4px)} 100%{transform:none}}
.dice.landed{animation:thud .5s ease-out}
@keyframes thud{30%{transform:scale(1.18)} 60%{transform:scale(.95)} 100%{transform:none}}

/* ---------- 3. HELPERS ---------- */
function fmt(n) {
  const neg = n < 0; n = Math.abs(Math.round(n));
  let s;
  if (n >= 1000) {
    let v = (n / 1000).toFixed(2);
    v = v.replace(/0+$/, '').replace(/\.$/, '');
    s = '₦' + v + 'M';
  } else s = '₦' + n + 'k';
  return (neg ? '−' : '') + s;
}

const boardCache = {};
function buildBoard(key) {
  if (boardCache[key]) return boardCache[key];
  const def = BOARDS[key] || BOARDS.classic;
  const nm = k => (def.names && def.names[k]) || LANDMARKS[k] || k;
  const tiles = def.layout.map((k, i) => {
    if (PROPS[k]) {
      const p = PROPS[k];
      return { i, key: k, type: 'prop', name: nm(k), group: p.g, price: p.price, rent: p.rent, house: GROUPS[p.g].house };
    }
    if (/^t\d$/.test(k)) return { i, key: k, type: 'transport', name: nm(k), price: 200, icon: (def.icons && def.icons[k]) || (/(Airport)/.test(nm(k)) ? 'plane' : undefined), air: (def.airports || ['t3', 't4']).includes(k) };
    if (/^u\d$/.test(k)) return { i, key: k, type: 'utility', name: nm(k), price: 150, icon: def.icons && def.icons[k] };
    const sp = (def.special && def.special[k]) || SPECIAL[k];
    return Object.assign({ i, key: k }, sp);
  });
  const k = (tiles.length - 4) / 4;
  boardCache[key] = { key, tiles, n: tiles.length, k, jail: tiles.findIndex(t => t.type === 'jail'), park: tiles.findIndex(t => t.type === 'park'), def };
  return boardCache[key];
}

const B = s => buildBoard(s.settings.board);
const jailName = s => B(s).tiles[B(s).jail].name;
const parkName = s => B(s).tiles[B(s).park].name;
function cardText(s, card) {
  return card.text.replace(/\{(\w+)\}/g, (m, k) => {
    if (k === 'JAIL') return jailName(s);
    const t = B(s).tiles.find(x => x.key === k);
    return t ? t.name : m;
  });
}
const T = (s, i) => B(s).tiles[i];
const P = (s, id) => s.players.find(p => p.id === id);
const cur = s => P(s, s.order[s.turn]);
const active = s => s.players.filter(p => !p.bankrupt);
const airports = s => B(s).tiles.filter(t => t.air);
const ownsAllAirports = (s, pid) => airports(s).length >= 2 && airports(s).every(t => s.props[t.i] && s.props[t.i].owner === pid);
const isBuyable = t => t && (t.type === 'prop' || t.type === 'transport' || t.type === 'utility');
const r6 = () => 1 + Math.floor(Math.random() * 6);

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function log(s, m) { s.log.push({ t: s.now || Date.now(), m }); if (s.log.length > 70) s.log.splice(0, s.log.length - 70); }

function groupTiles(s, g) { return B(s).tiles.filter(t => t.type === 'prop' && t.group === g); }
function ownsGroup(s, pid, g) { return groupTiles(s, g).every(t => s.props[t.i] && s.props[t.i].owner === pid); }
function countOwned(s, pid, type) { return B(s).tiles.filter(t => t.type === type && s.props[t.i] && s.props[t.i].owner === pid).length; }
function ownedBy(s, pid) { return B(s).tiles.filter(t => s.props[t.i] && s.props[t.i].owner === pid); }
function groupHasHouses(s, g) { return groupTiles(s, g).some(t => s.props[t.i] && s.props[t.i].houses > 0); }

function rentFor(s, i, diceSum, cardMult) {
  const t = T(s, i), pr = s.props[i];
  if (!pr || pr.mort) return 0;
  if (t.type === 'prop') {
    if (pr.houses > 0) return t.rent[pr.houses];
    let r = t.rent[0];
    if (s.settings.doubleRent && ownsGroup(s, pr.owner, t.group)) r *= 2;
    return r;
  }
  if (t.type === 'transport') {
    const n = countOwned(s, pr.owner, 'transport');
    const airBonus = t.air && ownsAllAirports(s, pr.owner) ? 2 : 1;
    return 25 * Math.pow(2, n - 1) * (cardMult ? 2 : 1) * airBonus;
  }
  if (t.type === 'utility') {
    if (cardMult) return diceSum * 10;
    const n = countOwned(s, pr.owner, 'utility');
    return diceSum * (n >= 3 ? 20 : n === 2 ? 10 : 4);
  }
  return 0;
}

function propValue(s, i) {
  const t = T(s, i), pr = s.props[i];
  if (!pr) return t.price || 0;
  let v = t.price + (pr.houses || 0) * (t.house || 0);
  if (pr.mort) v -= t.price / 2;
  return v;
}

function canAct(s, a, pid) {
  if (s.mode === 'local') return true;
  if (a.actor === pid) return true;
  const p = P(s, pid);
  return !!(p && p.bot && a.actor === s.hostId);
}

/* ---------- 4. MONEY AND MOVEMENT ---------- */
function pay(s, p, amt, to, toPot) {
  if (amt <= 0) return;
  p.cash -= amt;
  if (to) to.cash += amt;
  else if (toPot && s.settings.vacationCash) s.pot += amt;
  if (p.cash < 0) p.debtTo = to ? to.id : null;
}

function moveBy(s, p, steps) {
  const n = B(s).n, from = p.pos;
  let to = ((from + steps) % n + n) % n;
  if (steps > 0 && from + steps >= n) {
    p.cash += SALARY;
    s.fx.pays.push({ from: null, to: p.id, amt: SALARY, src: 'go' });
    log(s, `${p.name} passed Start and collected ${fmt(SALARY)} salary.`);
  }
  p.pos = to;
  s.fx.moves.push({ pid: p.id, from, steps });
}

function moveForwardTo(s, p, dest) {
  const n = B(s).n;
  moveBy(s, p, ((dest - p.pos) % n + n) % n);
}

function sendJail(s, p) {
  const from = p.pos;
  p.pos = B(s).jail; p.inJail = true; p.jailTurns = 0; p.doubles = 0;
  s.fx.moves.push({ pid: p.id, from, to: p.pos, direct: true });
  if (cur(s) && cur(s).id === p.id) s.rollAgain = false;
}

function after(s) {
  const c = cur(s);
  if (!c || c.bankrupt) return 'done';
  return s.rollAgain && !c.inJail ? 'roll' : 'done';
}

function land(s, p, opts) {
  opts = opts || {};
  const t = T(s, p.pos);
  const dice = s.dice[0] + s.dice[1];
  switch (t.type) {
    case 'prop': case 'transport': case 'utility': {
      const pr = s.props[p.pos];
      if (!pr) { s.phase = 'buy'; s.pending = { i: p.pos, cardMult: !!opts.cardMult }; return; }
      if (pr.owner === p.id) {
        if (t.air && ownsAllAirports(s, p.id) && !pr.mort) { s.flight = { pid: p.id, from: p.pos }; log(s, `${p.name} owns every airport and can take a flight from ${t.name}.`); }
        return;
      }
      if (pr.mort) { log(s, `${t.name} is mortgaged. No rent.`); return; }
      const owner = P(s, pr.owner);
      if (!owner || owner.bankrupt) return;
      if (owner.inJail && s.settings.noRentInJail) { log(s, `${owner.name} is in ${jailName(s)}, so ${p.name} pays no rent.`); return; }
      const rent = rentFor(s, p.pos, dice, opts.cardMult);
      pay(s, p, rent, owner);
      if (t.air && ownsAllAirports(s, owner.id)) log(s, `${owner.name} owns every airport, so the rent is doubled.`);
      s.fx.pays.push({ from: p.id, to: owner.id, amt: rent });
      log(s, `${p.name} paid ${fmt(rent)} rent to ${owner.name} for ${t.name}.`);
      return;
    }
    case 'tax':
      pay(s, p, t.amount, null, true);
      s.fx.pays.push({ from: p.id, to: null, amt: t.amount, dst: s.settings.vacationCash ? 'pot' : null });
      log(s, `${p.name} paid ${fmt(t.amount)} ${t.name}.`);
      return;
    case 'wahala': case 'ajo':
      drawCard(s, p, t.type);
      return;
    case 'gojail':
      sendJail(s, p);
      log(s, `${p.name} was sent to ${jailName(s)}.`);
      return;
    case 'park':
      if (s.settings.vacationCash && s.pot > 0) {
        log(s, `${p.name} collected the ${parkName(s)} pot of ${fmt(s.pot)}!`);
        s.fx.pays.push({ from: null, to: p.id, amt: s.pot, src: 'pot' });
        p.cash += s.pot; s.pot = 0;
      }
      return;
  }
}

function drawCard(s, p, deck) {
  if (!s.decks[deck] || !s.decks[deck].length) s.decks[deck] = shuffle(CARDS[deck].map((_, i) => i));
  const idx = s.decks[deck].shift();
  const card = CARDS[deck][idx];
  if (card.fx.t !== 'jailFree') s.decks[deck].push(idx);
  s.cardSeq = (s.cardSeq || 0) + 1;
  s.card = { deck, idx, seq: s.cardSeq, pid: p.id };
  log(s, `${p.name} drew ${deck === 'wahala' ? 'Wahala' : 'Ajo'}: “${cardText(s, card)}”`);
  const fx = card.fx;
  switch (fx.t) {
    case 'move': {
      let dest = B(s).tiles.findIndex(t => t.key === fx.to);
      if (dest < 0) dest = 0;
      moveForwardTo(s, p, dest); land(s, p); return;
    }
    case 'nearest': {
      const n = B(s).n;
      let d = p.pos;
      for (let k = 1; k <= n; k++) { const j = (p.pos + k) % n; if (T(s, j).type === fx.kind) { d = j; break; } }
      moveForwardTo(s, p, d); land(s, p, { cardMult: true }); return;
    }
    case 'back': moveBy(s, p, -fx.n); land(s, p); return;
    case 'jail': sendJail(s, p); return;
    case 'jailFree': p.jailCards.push(deck); return;
    case 'money':
      if (fx.n > 0) { p.cash += fx.n; s.fx.pays.push({ from: null, to: p.id, amt: fx.n }); }
      else { pay(s, p, -fx.n, null, true); s.fx.pays.push({ from: p.id, to: null, amt: -fx.n, dst: s.settings.vacationCash ? 'pot' : null }); }
      return;
    case 'each':
      active(s).forEach(o => { if (o.id !== p.id) { pay(s, p, fx.n, o); s.fx.pays.push({ from: p.id, to: o.id, amt: fx.n }); } });
      return;
    case 'fromEach':
      active(s).forEach(o => { if (o.id !== p.id) { pay(s, o, fx.n, p); s.fx.pays.push({ from: o.id, to: p.id, amt: fx.n }); } });
      return;
    case 'repairs': {
      let total = 0;
      ownedBy(s, p.id).forEach(t => { const h = s.props[t.i].houses || 0; total += h === 5 ? fx.hotel : h * fx.house; });
      if (total > 0) { pay(s, p, total, null, true); s.fx.pays.push({ from: p.id, to: null, amt: total }); log(s, `${p.name} paid ${fmt(total)} for repairs.`); }
      return;
    }
  }
}

function nextTurn(s) {
  s.flight = null;
  const c = cur(s);
  if (c) c.doubles = 0;
  s.rollAgain = false; s.pending = null;
  if (active(s).length <= 1) return;
  let t = s.turn;
  for (let k = 0; k < s.order.length; k++) {
    t = (t + 1) % s.order.length;
    const p = P(s, s.order[t]);
    if (p && !p.bankrupt) break;
  }
  s.turn = t; s.phase = 'roll';
  s.turnStarted = s.now; s.turnCount = (s.turnCount || 0) + 1;
}

function goBankrupt(s, p, reason) {
  if (p.bankrupt) return;
  const cred = p.cash < 0 && p.debtTo ? P(s, p.debtTo) : null;
  const heir = cred && !cred.bankrupt ? cred : null;
  ownedBy(s, p.id).forEach(t => {
    const pr = s.props[t.i];
    if (heir) { pr.owner = heir.id; pr.houses = 0; }
    else delete s.props[t.i];
  });
  p.jailCards.forEach(d => s.decks[d].push(CARDS[d].findIndex(c => c.fx.t === 'jailFree')));
  p.jailCards = [];
  p.bankrupt = true; p.cash = 0; p.inJail = false;
  s.trades = s.trades.filter(tr => tr.from !== p.id && tr.to !== p.id);
  if (s.auction && s.auction.by === p.id) { s.auction.by = null; s.auction.high = 0; }
  log(s, heir ? `${p.name} went bankrupt. ${heir.name} takes their properties.` : `${p.name} ${reason || 'went bankrupt'}. Their properties go back to the bank.`);
  const c = cur(s);
  if (c && c.id === p.id && !s.auction) nextTurn(s);
}

function checkWinner(s) {
  if (s.status !== 'playing') return;
  const a = active(s);
  if (s.mode === 'online' && a.length > 1 && !a.some(p => !p.bot)) {
    s.status = 'closed'; s.closedReason = 'Every player has left, so the room has closed.';
    log(s, 'Every player has left. Room closed.');
    return;
  }
  if (a.length === 1) {
    s.status = 'ended'; s.winner = a[0].id; s.phase = 'over';
    log(s, `${a[0].name} is the Naija Landlord! 🏆`);
  }
}

/* ---------- 5. BUILD / MORTGAGE CHECKS ---------- */
function buildCheck(s, pid, i) {
  const t = T(s, i), pr = s.props[i], p = P(s, pid);
  if (!t || t.type !== 'prop' || !pr || pr.owner !== pid) return 'You do not own this property.';
  if (!ownsGroup(s, pid, t.group)) return 'You need the full colour set first.';
  if (groupTiles(s, t.group).some(g => s.props[g.i].mort)) return 'Pay off mortgages in this set first.';
  if (pr.houses >= 5) return 'This property already has a hotel.';
  if (s.settings.evenBuild) {
    const min = Math.min(...groupTiles(s, t.group).map(g => s.props[g.i].houses));
    if (pr.houses > min) return 'Build evenly across the set.';
  }
  if (p.cash < t.house) return 'Not enough cash.';
  return null;
}
function sellCheck(s, pid, i) {
  const t = T(s, i), pr = s.props[i];
  if (!pr || pr.owner !== pid || !pr.houses) return 'No buildings to sell here.';
  if (s.settings.evenBuild) {
    const max = Math.max(...groupTiles(s, t.group).map(g => s.props[g.i].houses));
    if (pr.houses < max) return 'Sell evenly across the set.';
  }
  return null;
}
function mortgageCheck(s, pid, i) {
  const t = T(s, i), pr = s.props[i];
  if (!s.settings.mortgage) return 'Mortgages are turned off in this game.';
  if (!pr || pr.owner !== pid) return 'You do not own this property.';
  if (pr.mort) return 'Already mortgaged.';
  if (t.type === 'prop' && groupHasHouses(s, t.group)) return 'Sell the buildings in this set first.';
  return null;
}
const unmortgageCost = t => Math.ceil(t.price / 2 * 1.1);
function unmortgageCheck(s, pid, i) {

function newPlayer(s, id, name, token, bot) {
  return { id, name, token, bot: !!bot, color: PLAYER_COLORS[s.players.length % PLAYER_COLORS.length],
    cash: 0, pos: 0, inJail: false, jailTurns: 0, jailCards: [], doubles: 0, bankrupt: false, debtTo: null };
}

function cleanOffer(o) {
  o = o || {};
  return { cash: Math.max(0, Math.floor(+o.cash || 0)), props: Array.isArray(o.props) ? o.props.map(Number).filter(n => n >= 0) : [], cards: Math.max(0, Math.floor(+o.cards || 0)) };

function offerCheck(s, p, off) {

  if (off.cash > p.cash) return `${p.name} does not have ${fmt(off.cash)}.`;
  if (off.cards > p.jailCards.length) return `${p.name} does not have that many cards.`;
  for (const i of off.props) {
    const pr = s.props[i], t = T(s, i);
    if (!pr || pr.owner !== p.id) return `${p.name} no longer owns ${t ? t.name : 'that property'}.`;
    if (t.type === 'prop' && groupHasHouses(s, t.group)) return `Sell the buildings on the ${GROUPS[t.group].name.toLowerCase()} set before trading it.`;

  return null;
}
function transfer(s, from, to, off) {
  from.cash -= off.cash; to.cash += off.cash;
  if (off.cash) s.fx.pays.push({ from: from.id, to: to.id, amt: off.cash });
  off.props.forEach(i => { s.props[i].owner = to.id; });
  for (let k = 0; k < off.cards; k++) to.jailCards.push(from.jailCards.pop());
}

function newGame(opts) {
  const settings = Object.assign({}, DEFAULT_SETTINGS, opts.settings || {});
  const now = Date.now();
  return {
    v: 1, mode: opts.mode, code: opts.code || '', status: 'lobby', hostId: opts.hostId || null,
    createdAt: now, updatedAt: now, settings,
    players: [], playerIds: [], order: [], turn: 0, phase: 'roll', props: {},
    dice: [3, 4], rollSeq: 0, rollAgain: false, pending: null, auction: null, trades: [], pot: 0,
    decks: {}, card: null, cardSeq: 0, log: [], chat: [], winner: null,
    fx: { seq: 0, moves: [], pays: [] }, seq: 0,

}

function reduce(s0, a) {
  const fn = ACTIONS[a.type];
  if (!fn) return { error: 'Unknown action.' };
  const s = JSON.parse(JSON.stringify(s0));
  s.now = a.now || Date.now();
  s.fx = { seq: (s0.fx && s0.fx.seq || 0) + 1, moves: [], pays: [], by: a.by || null, type: a.type };
  const err = fn(s, a);
  if (err) return { error: err };
  s.seq = (s.seq || 0) + 1; s.updatedAt = s.now;
  const c0 = s0.status === 'playing' && cur(s0);
  if (c0 && a.by === c0.id) s.activeAt = s.now;
  if (s.turn !== s0.turn) s.activeAt = s.now;
  checkWinner(s);
  return { state: s };
}

/* ---------- 7. BOTS ----------
   Three levels:
   1 Learner        buys on impulse, bids low, accepts fair trades, rarely builds.
   2 Hustler        sensible buyer and builder, wants a good premium in trades.
   3 Business Tycoon  values sets and blocks rivals, keeps a cash buffer sized to the danger on the board,
                    builds to three houses fast, bids hard at auction and almost never hands a rival a set. */
const BOT_LEVELS = { 1: 'Learner', 2: 'Hustler', 3: 'Business Tycoon' };
const lvl = p => (p && p.level) || 2;

function completesGroup(s, pid, i) {
  const t = T(s, i);
  if (t.type !== 'prop') return false;
  return groupTiles(s, t.group).every(g => g.i === i || (s.props[g.i] && s.props[g.i].owner === pid));

  if (t.key === 'MOSQUE') return ICONS.mosque;
  if (t.key === 'POLL') return ICONS.ballot;
  if (t.type === 'transport') return { t1: ICONS.bus, t2: ICONS.train, t3: ICONS.brt, t4: ICONS.plane }[t.key] || ICONS.bus;
  if (t.type === 'utility') return { u1: ICONS.bulb, u2: ICONS.drop, u3: ICONS.flame }[t.key] || ICONS.bulb;
  if (t.type === 'tax') return ICONS.tax;
  if (t.type === 'wahala') return ICONS.wahala;
  if (t.type === 'ajo') return ICONS.ajo;
  return '';
}

/* ---------------- sound ---------------- */
let actx = null;
function sound(kind) {
  if (ui.muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    const tone = (f, d, when, type, vol) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(vol || .08, t0 + when); g.gain.exponentialRampToValueAtTime(.0001, t0 + when + d);
      o.connect(g).connect(actx.destination); o.start(t0 + when); o.stop(t0 + when + d + .02);
    };
    if (kind === 'tick') tone(880, .05, 0, 'square', .025);
    if (kind === 'dice') for (let i = 0; i < 7; i++) tone(180 + Math.random() * 260, .04, i * .07, 'square', .04);
    if (kind === 'cash') { tone(1046, .12, 0, 'triangle', .07); tone(1568, .2, .09, 'triangle', .07); }
    if (kind === 'bad') { tone(220, .18, 0, 'sawtooth', .04); tone(165, .25, .14, 'sawtooth', .04); }
    if (kind === 'card') { tone(660, .08, 0, 'triangle', .05); tone(990, .12, .07, 'triangle', .05); }
    if (kind === 'turn') { tone(784, .1, 0, 'sine', .06); tone(1175, .16, .1, 'sine', .06); }
  } catch (e) {}
}

/* ---------------- music: live Naija radio ----------------
   Real Nigerian and Afrobeats radio stations, streamed live. The list comes from the free
   public Radio Browser directory (radio-browser.info), so new stations appear by themselves.
   Live radio is the same moment for everyone, so a whole room hears the same song together:
   the host picks the station and everyone else tunes in to it. */
var EMBEDS_OK = false;   // true in the web build; the claude.ai page can only play the Game beat
const RB_HOSTS = ['https://de1.api.radio-browser.info', 'https://de2.api.radio-browser.info', 'https://fi1.api.radio-browser.info', 'https://all.api.radio-browser.info'];
const RB_Q = '&order=clickcount&reverse=true&hidebroken=true&limit=';
const RADIO_QUERIES = {
  naija: ['/json/stations/search?countrycode=NG' + RB_Q + '120'],
  afro: ['/json/stations/search?tag=afrobeats' + RB_Q + '60', '/json/stations/search?tag=afrobeat' + RB_Q + '40', '/json/stations/search?tag=amapiano' + RB_Q + '25'],
  oldschool: ['/json/stations/search?tag=highlife' + RB_Q + '40', '/json/stations/search?tag=fuji' + RB_Q + '20', '/json/stations/search?tag=juju' + RB_Q + '20',
    '/json/stations/search?countrycode=NG&tag=oldies' + RB_Q + '20', '/json/stations/search?countrycode=NG&name=throwback' + RB_Q + '20'],
};
const MODES = { naija: 'Naija stations', afro: 'Afrobeats', oldschool: 'Old school', beat: 'Game beat' };
const mpref = Object.assign({ on: true, mode: 'naija', vol: 70 }, LS.get('nl-music3') || {});
if (!MODES[mpref.mode]) mpref.mode = 'naija';
const music = { open: false, unlocked: false, audio: null, stations: {}, loading: false, current: null, follow: false, status: '', tried: new Set(), stallT: null, lastRoomTrack: null };
function saveMusic() { LS.set('nl-music3', mpref); }
const shuffleOK = () => !music.follow;
function setStatus(t) { music.status = t; const el = $('#mstatus'); if (el) el.textContent = t; }

function musicHTML() {
  const radio = EMBEDS_OK && mpref.mode !== 'beat';
  const inRoom = ui.mode === 'online' && ui.state;
  const hostCtl = !inRoom || ui.state.hostId === ui.me;
  const modes = Object.entries(MODES).filter(([k]) => EMBEDS_OK || k === 'beat');
  const list = (music.stations[mpref.mode] || []).slice(0, 16);
  const cur = music.current;
  return `${mpref.on && !music.unlocked ? '<div class="mhint">🔊 Tap anywhere to turn on the music</div>' : ''}
  <button class="mfab ${mpref.on ? 'on' : ''}" data-music="toggle" aria-label="Music">${ICONS.music}<span>${mpref.on ? (cur && radio ? esc(cur.n.slice(0, 22)) : 'Music on') : 'Music off'}</span>${mpref.on && cur && radio ? '<i class="live">LIVE</i>' : ''}</button>
  <div class="mdock" ${music.open ? '' : 'data-closed'} role="dialog" aria-label="Music">
    <div style="display:flex;align-items:center;gap:8px"><b style="flex:1">Naija radio</b><button class="btn ghost small" data-music="toggle">Hide</button></div>
    ${radio && cur && mpref.on ? `<div class="now"><span class="lbl">On air</span><b>${esc(cur.n)}</b><small class="muted">${esc(cur.c || '')}</small></div>` : ''}
    <div id="mstatus" class="small" style="color:var(--danfo)">${esc(music.status || '')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">

    </div>

    <div class="field"><label class="lbl" for="mvol">Volume</label><input type="range" id="mvol" min="0" max="100" step="5" value="${mpref.vol}" style="width:100%"></div>
    <p class="small muted" style="margin:0">${EMBEDS_OK

function renderMusic() {
  let root = $('#music');
  if (!root) { root = document.createElement('div'); root.id = 'music'; document.body.appendChild(root); }
  const scroll = $('.mdock', root) ? $('.mdock', root).scrollTop : 0;
  root.innerHTML = musicHTML();
  const d = $('.mdock', root); if (d) d.scrollTop = scroll;

/* station directory */
async function rbFetch(path) {
  const hosts = RB_HOSTS.slice().sort(() => Math.random() - 0.5);
  for (const h of hosts) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 7000);
      const r = await fetch(h + path, { signal: ctl.signal }); clearTimeout(t);
      if (r.ok) return await r.json();
    } catch (e) {}
  }
  return null;
}
async function loadStations(mode) {
  if (music.stations[mode] && music.stations[mode].length) return music.stations[mode];
  const cached = LS.get('nl-radio-' + mode);
  if (cached && Date.now() - cached.t < 6 * 3600 * 1000 && cached.list.length) { music.stations[mode] = cached.list; return cached.list; }
  setStatus('Finding stations…');
  const results = await Promise.all((RADIO_QUERIES[mode] || []).map(rbFetch));
  const seen = new Map();
  results.forEach(arr => (arr || []).forEach(s => {
    const url = s.url_resolved || s.url || '';
    if (!/^https:\/\//i.test(url) || s.hls === 1 || s.lastcheckok === 0 || seen.has(s.stationuuid)) return;
    seen.set(s.stationuuid, { u: s.stationuuid, n: String(s.name || 'Radio').trim().slice(0, 48), url, c: [s.state, s.country].filter(Boolean).join(', ').slice(0, 40), k: s.clickcount || 0 });
  }));
  const list = Array.from(seen.values()).sort((a, b) => b.k - a.k);
  if (list.length) { music.stations[mode] = list; LS.set('nl-radio-' + mode, { t: Date.now(), list }); setStatus(''); }
  else if (cached && cached.list.length) { music.stations[mode] = cached.list; }
  else setStatus('Could not load the station list. Check your internet, or pick Game beat.');
  return music.stations[mode] || [];
}

/* the audio player */
function audioEl() {
  if (music.audio) return music.audio;
  const a = new Audio(); a.preload = 'none'; a.crossOrigin = null;
  a.addEventListener('playing', () => { clearTimeout(music.stallT); setStatus(music.unlocked ? '' : 'Playing quietly. Tap anywhere to hear it.'); });
  a.addEventListener('error', () => stationFailed());
  a.addEventListener('stalled', () => { clearTimeout(music.stallT); music.stallT = setTimeout(stationFailed, 9000); });
  a.addEventListener('waiting', () => { clearTimeout(music.stallT); music.stallT = setTimeout(stationFailed, 12000); });
  music.audio = a;
  return a;
}
function tune(st, broadcast) {
  if (!st) return;
  const a = audioEl();
  music.current = st; music.tried.add(st.u);
  a.src = st.url; a.volume = mpref.vol / 100; a.muted = !music.unlocked;
  setStatus('Tuning in to ' + st.n + '…');
  clearTimeout(music.stallT); music.stallT = setTimeout(stationFailed, 12000);
  const p = a.play(); if (p && p.catch) p.catch(() => { if (!music.unlocked) setStatus(''); });
  if (broadcast !== false && shuffleOK()) musicRoomBroadcast({ u: st.u, url: st.url, n: st.n, c: st.c });
  renderMusic();
}
function stationFailed() {
  clearTimeout(music.stallT);
  if (!mpref.on || mpref.mode === 'beat') return;
  if (music.follow) { setStatus('The host\'s station is not reachable from here. Retrying…'); setTimeout(() => music.current && tune(music.current, false), 5000); return; }
  setStatus('That station is off air. Trying another…');
  nextStation();
}
async function nextStation(pickRandomFromTop) {
  if (!mpref.on || !EMBEDS_OK || mpref.mode === 'beat') return;
  const list = await loadStations(mpref.mode);
  if (!list.length) return;
  let pool = list.filter(s => !music.tried.has(s.u));
  if (!pool.length) { music.tried.clear(); pool = list; }
  const top = pool.slice(0, Math.max(8, Math.ceil(pool.length / 3)));
  tune(top[Math.floor(Math.random() * top.length)]);
}
async function startMusic() {
  if (!mpref.on) return;
  if (mpref.mode === 'beat' || !EMBEDS_OK) { if (music.unlocked) Beat.start(); return; }
  if (music.follow && music.lastRoomTrack) { followTrack(music.lastRoomTrack); return; }
  if (music.current && music.audio) { const p = music.audio.play(); if (p && p.catch) p.catch(() => {}); return; }
  nextStation();
}
function stopMusicAll() {
  Beat.stop();
  if (music.audio) { music.audio.pause(); music.audio.removeAttribute('src'); music.audio.load(); }
  clearTimeout(music.stallT);
}
/* rooms: everyone tunes in to the host's station */
function followTrack(tr) {
  if (!tr || !tr.url) return;
  music.follow = true; music.lastRoomTrack = tr;
  if (!mpref.on || mpref.mode === 'beat' || !EMBEDS_OK) { renderMusic(); return; }
  if (!music.current || music.current.u !== tr.u) tune({ u: tr.u, url: tr.url, n: tr.n, c: tr.c }, false);
  else renderMusic();
}
function musicRoomBroadcast() {}       // replaced in the web build
function musicCurrent() { const c = music.current; return c && mpref.mode !== 'beat' ? { u: c.u, url: c.url, n: c.n, c: c.c } : null; }

/* the first tap anywhere turns the sound on (browsers block sound before that) */
function unlockAudio() {
  if (music.unlocked) return;
  music.unlocked = true;
  if (mpref.on) {
    if (mpref.mode === 'beat' || !EMBEDS_OK) Beat.start();
    else if (music.audio && music.current) { music.audio.muted = false; music.audio.volume = mpref.vol / 100; const p = music.audio.play(); if (p && p.catch) p.catch(() => tune(music.current, false)); }
    else startMusic();
  }
  setStatus('');
  renderMusic();
}
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('keydown', unlockAudio, true);

document.addEventListener('click', e => {
  const b = e.target.closest('[data-music],[data-mmode],[data-sta]');
  if (!b || b.disabled) return;
  if (b.dataset.sta) {
    const st = (music.stations[mpref.mode] || []).find(s => s.u === b.dataset.sta);
    if (st) { Beat.stop(); tune(st); }
    return;
  }
  if (b.dataset.mmode) {
    const m = b.dataset.mmode;
    if (m === mpref.mode) return;
    mpref.mode = m; saveMusic(); stopMusicAll(); music.current = null; music.tried.clear();
    if (m === 'beat') { if (music.unlocked && mpref.on) Beat.start(); renderMusic(); }
    else if (music.follow && music.lastRoomTrack) followTrack(music.lastRoomTrack);
    else { renderMusic(); loadStations(m).then(() => { renderMusic(); nextStation(); }); }
    return;
  }
  const k = b.dataset.music;
  if (k === 'toggle') {
    music.open = !music.open;
    if (music.open && EMBEDS_OK && mpref.mode !== 'beat') loadStations(mpref.mode).then(renderMusic);
    const d = $('.mdock'); if (d) d.toggleAttribute('data-closed', !music.open);
    return;
  }
  if (k === 'power') {
    mpref.on = !mpref.on; saveMusic();
    if (!mpref.on) stopMusicAll();
    else if (mpref.mode === 'beat' || !EMBEDS_OK) Beat.start();
    else if (music.follow && music.lastRoomTrack) { music.current = null; followTrack(music.lastRoomTrack); }
    else if (music.current) tune(music.current, false); else nextStation();
    renderMusic(); return;
  }
  if (k === 'skip') { nextStation(); return; }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'mvol') return;
  mpref.vol = +e.target.value; saveMusic();
  Beat.setVol(mpref.vol / 100);
  if (music.audio) music.audio.volume = mpref.vol / 100;
});

/* an original Afrobeats-style groove: kick, shaker, rim, log-drum bass and soft chords */
const Beat = {
  on: false, step: 0, next: 0, timer: null, master: null, noise: null,
  bpm: 106,
  chords: [[62, 65, 69, 72], [55, 59, 62, 65], [60, 64, 67, 71], [57, 60, 64, 67]],
  roots: [38, 43, 36, 45],
  start() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { return; }
    if (!this.noise) {
      const len = actx.sampleRate * 0.5, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
    }
    if (this.on) return;
    this.master = actx.createGain(); this.master.gain.value = mpref.vol / 100 * 0.5; this.master.connect(actx.destination);
    this.on = true; this.step = 0; this.next = actx.currentTime + 0.08;
    this.timer = setInterval(() => this.tick(), 25);
  },
  stop() { this.on = false; clearInterval(this.timer); if (this.master) { try { this.master.gain.setTargetAtTime(0, actx.currentTime, 0.05); } catch (e) {} } this.master = null; },
  setVol(v) { if (this.master) this.master.gain.setTargetAtTime(v * 0.5, actx.currentTime, 0.05); },
  tick() {
    if (!this.on) return;
    const spb = 60 / this.bpm / 4;
    while (this.next < actx.currentTime + 0.12) { this.play(this.step, this.next); this.next += spb; this.step = (this.step + 1) % 64; }
  },
  hz: m => 440 * Math.pow(2, (m - 69) / 12),
  env(node, t, a, peak, d) { node.gain.setValueAtTime(0.0001, t); node.gain.exponentialRampToValueAtTime(peak, t + a); node.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  osc(type, f, t, dur, peak, f2) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    this.env(g, t, 0.005, peak, dur); o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  hit(t, freq, q, dur, peak, type) {
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = this.noise; f.type = type || 'highpass'; f.frequency.value = freq; f.Q.value = q;
    this.env(g, t, 0.002, peak, dur); s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t + dur + 0.05);
  },
  play(step, t) {
    if (!this.master) return;
    const s16 = step % 16, bar = Math.floor(step / 16) % 4;
    if (s16 === 0 || s16 === 7 || s16 === 10) this.osc('sine', 140, t, 0.32, 0.9, 42);              // kick
    this.hit(t, 7500, 0.7, s16 % 2 ? 0.05 : 0.03, s16 % 4 === 2 ? 0.22 : 0.1);                      // shaker
    if (s16 === 4 || s16 === 12) this.hit(t, 1900, 2.5, 0.12, 0.35, 'bandpass');                    // clap
    if ([3, 6, 11, 14].includes(s16)) this.osc('square', 1650, t, 0.025, 0.06);                      // rim
    if ([0, 3, 6, 10, 13].includes(s16)) { const r = this.roots[bar] + (s16 === 13 ? 7 : 0); this.osc('sine', this.hz(r + 12), t, 0.28, 0.5, this.hz(r)); } // log drum
    if ([2, 6, 10, 14].includes(s16)) this.chords[bar].forEach(m => this.osc('triangle', this.hz(m), t, 0.16, 0.045));   // chord stabs
    if (s16 === 9 || (s16 === 15 && bar % 2)) this.osc('sine', 330, t, 0.18, 0.18, 210);           // talking drum
  },
};

function diceSound(ms) {

/* ---------------- board geometry ---------------- */
function tilePlace(i, k) {
  const C = C_UNITS, W = k + 2 * C;
  if (i === 0) return { r: k + 2, c: k + 2, side: 'corner', x: W - C / 2, y: W - C / 2 };
  if (i <= k) return { r: k + 2, c: k - i + 2, side: 'b', x: C + (k - i) + .5, y: W - C / 2 };
  if (i === k + 1) return { r: k + 2, c: 1, side: 'corner', x: C / 2, y: W - C / 2 };
  if (i <= 2 * k + 1) { const m = i - (k + 1); return { r: k - m + 2, c: 1, side: 'l', x: C / 2, y: C + (k - m) + .5 }; }
  if (i === 2 * k + 2) return { r: 1, c: 1, side: 'corner', x: C / 2, y: C / 2 };
  if (i <= 3 * k + 2) { const m = i - (2 * k + 2); return { r: 1, c: m + 1, side: 't', x: C + (m - 1) + .5, y: C / 2 }; }
  if (i === 3 * k + 3) return { r: 1, c: k + 2, side: 'corner', x: W - C / 2, y: C / 2 };
  const m = i - (3 * k + 3); return { r: m + 1, c: k + 2, side: 'r', x: W - C / 2, y: C + (m - 1) + .5 };
}

function cornerHTML(t) {
  if (t.type === 'go') return `<div><div class="cn">START</div><div class="cs">Collect ${fmt(SALARY)}<br>salary</div>${ICONS.arrow}</div>`;
  if (t.type === 'jail') return `<div class="cell"><b>${esc(t.name.toUpperCase())}</b></div><div class="vis">JUST<br>VISITING</div>`;
  if (t.type === 'park') return `<div>${ICONS.drum}<div class="cn">${esc(t.name.toUpperCase())}</div><div class="pot" data-pot></div></div>`;
  if (t.type === 'gojail') return `<div>${ICONS.siren}<div class="cn">${t.name === 'Go to Kirikiri' ? 'GO TO<br>KIRIKIRI' : esc(t.name.toUpperCase()) + '<br><small style="font-size:.6em">' + esc(t.sub || '') + '</small>'}</div></div>`;
  return '';
}

function tileHTML(t, k, boardKey) {
  const pl = tilePlace(t.i, k);
  const pos = `grid-row:${pl.r};grid-column:${pl.c}`;
  if (pl.side === 'corner') return `<div class="tile corner c-${t.type}${t.name.length > 9 ? ' long' : ''}" data-i="${t.i}" style="${pos}" role="button" tabindex="-1" aria-label="${esc(t.name)}">${cornerHTML(t)}</div>`;
  let inner;
  if (t.type === 'prop') inner = `<div class="band" style="--gc:${GROUPS[t.group].color}"><div class="hs"></div></div><div class="t-art">${propArt(boardKey, t.key)}</div><div class="t-name">${esc(t.name)}</div><div class="t-price">${fmt(t.price)}</div><div class="own" hidden></div>`;
  else if (t.type === 'transport' || t.type === 'utility') inner = `<div class="t-ico">${tileIcon(t)}</div><div class="t-name">${esc(t.name.replace('International', "Int'l"))}</div><div class="t-price">${fmt(t.price)}</div><div class="own" hidden></div>`;
  else if (t.type === 'tax') inner = `<div class="t-ico">${tileIcon(t)}</div><div class="t-name">${esc(t.name)}</div><div class="t-price">Pay ${fmt(t.amount)}</div>`;
  else if (t.type === 'rest') inner = `<div class="t-ico" style="flex:1;align-items:center">${tileIcon(t)}</div><div class="t-name" style="flex:none;padding-bottom:3px">${esc(t.name)}</div>`;
  else inner = `<div class="t-name" style="font-family:var(--f-display);font-weight:400;color:${t.type === 'wahala' ? '#C0331E' : '#0B7A47'}">${esc(t.name)}</div><div class="t-ico" style="flex:1;align-items:center">${tileIcon(t)}</div>`;
  return `<div class="tile side-${pl.side}" data-i="${t.i}" style="${pos}" role="button" tabindex="-1" aria-label="${esc(t.name)}"><div class="t-in">${inner}</div></div>`;
}

function boardHTML(key, withCenter) {
  const b = buildBoard(key), k = b.k, W = k + 2 * C_UNITS, p = (C_UNITS / W * 100).toFixed(3);
  const cols = `${C_UNITS}fr repeat(${k}, 1fr) ${C_UNITS}fr`;
  return `<div class="board" data-board="${key}" data-w="${W}">
    <div class="frame"></div>
    <div class="grid" style="grid-template-columns:${cols};grid-template-rows:${cols}">${b.tiles.map(t => tileHTML(t, k, key)).join('')}</div>
    <div class="tokens" style="position:absolute;inset:3px">
      ${withCenter ? `<div class="center" style="left:calc(${p}% + 2px);top:calc(${p}% + 2px);right:calc(${p}% + 2px);bottom:calc(${p}% + 2px);pointer-events:auto"></div>` :
        `<div class="center" style="left:calc(${p}% + 2px);top:calc(${p}% + 2px);right:calc(${p}% + 2px);bottom:calc(${p}% + 2px)"><div class="c-logo">NAIJA<br><span>LANDLORD</span></div></div>`}
    </div>
  </div>`;
}

function houseSVG(c) {
  return `<svg class="hse" viewBox="0 0 12 13" aria-hidden="true"><path d="M1 6.5 6 1.5l5 5V12H1z" fill="${c}" stroke="#141414" stroke-width="1.1" stroke-linejoin="round"/><path d="M1.8 6.2 6 2.3l4.2 3.9" fill="none" stroke="#fff" stroke-width=".7" opacity=".75"/><rect x="4.7" y="8.2" width="2.6" height="3.8" fill="#141414" opacity=".55"/></svg>`;
}
function hotelSVG(c) {
  let w = '';
  for (let r = 0; r < 2; r++) for (let k = 0; k < 6; k++) if (!(r === 1 && (k === 2 || k === 3))) w += `<rect x="${3 + k * 4.2}" y="${5 + r * 4}" width="2.4" height="2.2" fill="#FFF6C9"/>`;
  return `<svg class="htl" viewBox="0 0 30 16" aria-hidden="true"><rect x="1" y="3" width="28" height="12.4" rx="1" fill="${c}" stroke="#141414" stroke-width="1.1"/><rect x="0" y="1" width="30" height="3" rx="1" fill="#141414"/>${w}<rect x="12.6" y="9.4" width="4.8" height="6" fill="#141414" opacity=".7"/></svg>`;
}
function buildingsHTML(owner, houses) {
  if (!owner) return '';
  if (houses === 5) return hotelSVG(owner.color);
  if (houses > 0) return houseSVG(owner.color).repeat(houses);
  return `<span class="plot" style="--oc:${owner.color}">${owner.token}</span>`;
}

const boardObservers = new WeakMap();
function mountBoard(el) {
  if (!el || boardObservers.has(el)) return;
  const W = +el.dataset.w;
  const fit = () => {
    const w = el.clientWidth - 6;
    if (!w) return;
    const u = w / W;
    el.style.setProperty('--u', u.toFixed(2) + 'px');
    el.classList.toggle('compact', u < 50);
    el.classList.toggle('tiny', u < 35);
  };
  const ro = new ResizeObserver(fit); ro.observe(el); fit();
  boardObservers.set(el, ro);
}

/* ---------------- dice ---------------- */
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const FACE_T = { 1: '', 6: 'rotateY(180deg)', 2: 'rotateY(90deg)', 5: 'rotateY(-90deg)', 3: 'rotateX(90deg)', 4: 'rotateX(-90deg)' };
const SHOW = { 1: [0, 0], 6: [0, -180], 2: [0, -90], 5: [0, 90], 3: [-90, 0], 4: [90, 0] };
function dieHTML() {
  return `<div class="die" style="--d:max(30px, calc(var(--u)*.95))">${[1, 2, 3, 4, 5, 6].map(v =>
    `<div class="face" style="transform:${FACE_T[v]} translateZ(calc(var(--d) / 2))">${Array.from({ length: 9 }, (_, i) => PIPS[v].includes(i) ? `<i${v === 1 ? ' class="red"' : ''}></i>` : '<span></span>').join('')}</div>`).join('')}</div>`;
}
function setDice(root, vals, spins, ms) {
  const box = $('.dice', root);
  if (box && ms) { box.classList.remove('rolling'); void box.offsetWidth; box.style.setProperty('--roll', ms + 'ms'); box.classList.add('rolling'); setTimeout(() => box.classList.remove('rolling'), ms); }
  $$('.die', root).forEach((d, k) => {
    const [x, y] = SHOW[vals[k]] || [0, 0];
    const turns = ms ? Math.round(ms / 450) : 0;
    const sx = (spins * 4 + turns) * 360 + (k ? 360 : 0), sy = (spins * 4 + turns + k) * 360;
    d.style.transition = ms ? `transform ${ms}ms cubic-bezier(.12,.62,.18,1)` : 'none';
    d.style.transform = `rotateX(${x - sx}deg) rotateY(${y + sy}deg) rotateZ(${k ? 360 * turns : -360 * turns}deg)`;
    d.style.width = d.style.height = 'var(--d)';
  });
}

async function loadRooms() {
  if (!onlineOK()) return;

    const cutoff = Date.now() - 6 * 3600 * 1000;
    const [open, mine] = await Promise.all([
      ui.db.collection('games').where('status', '==', 'lobby').limit(40).get(),
      ui.db.collection('games').where('playerIds', 'array-contains', ui.me).limit(40).get(),
    ]);
    const map = new Map();
    open.docs.forEach(d => { const v = d.data(); if (v && v.updatedAt > cutoff && v.settings.public !== false) map.set(v.code, Object.assign({ mine: false }, v)); });
    mine.docs.forEach(d => { const v = d.data(); if (v && v.status !== 'ended' && v.updatedAt > cutoff - 18 * 3600 * 1000) map.set(v.code, Object.assign({}, v, { mine: true })); });

async function joinRoom(code) {
  if (!onlineOK()) return;
  code = String(code || '').trim().toUpperCase();
  if (!/^[A-Z0-9]{4,6}$/.test(code)) { toast('Type the 5-letter room code.', true); return; }
  const me = readMe();
  try {
    const snap = await ui.db.doc('games/' + code).get();
    if (!snap.exists) { toast('No room with that code.', true); return; }
    const s = snap.data();
    if (s.status === 'lobby' && !s.playerIds.includes(ui.me)) {
      if (!me.name || me.name === 'Player') { toast('Type your name first.', true); $('#myName') && $('#myName').focus(); return; }
      if (s.players.length >= s.settings.maxPlayers) { toast('That room is full.', true); return; }
      ui.gameRef = ui.db.doc('games/' + code); ui.lockRef = ui.db.doc('locks/' + code);
      const r = await onlineDispatch({ type: 'join', by: ui.me, name: me.name, token: me.token });
      if (r && r.error) { toast(r.error, true); return; }
    }

async function onlineDispatch(a) {
  const holder = ui.me + ':' + TAB_ID;
  for (let i = 0; i < 14; i++) {
    try { const r = await ui.lockRef.acquire({ holder, ttlMs: 1200 }); if (r.acquired) break; }
    catch (e) { break; }
    await sleep(140 + Math.random() * 200);
  }
  const snap = await ui.gameRef.get();
  if (!snap.exists) return { error: 'Room not found.' };
  const res = reduce(snap.data(), Object.assign({}, a, { actor: ui.me, now: Date.now() }));
  if (res.error) return res;
  await ui.gameRef.set(res.state);
  return res;
}

/* ---------------- dispatch ---------------- */
async function dispatch(a, quiet) {
  if (!ui.state) return;
  if (ui.mode === 'local') {
    const r = reduce(ui.state, Object.assign({}, a, { now: Date.now() }));
    if (r.error) { if (!quiet) toast(r.error, true); return r; }
    setState(r.state); return r;
  }
  if (!quiet) { ui.sending = true; renderCenter(); }
  try {
    const r = await onlineDispatch(a);
    if (r && r.error) { if (!quiet) toast(r.error, true); }
    else if (r && r.state && (!ui.state || r.state.seq > ui.state.seq)) setState(r.state);
    return r;
  } catch (e) { if (!quiet) toast(dbErr(e), true); return { error: 'network' }; }
  finally { if (!quiet) { ui.sending = false; renderCenter(); } }
}

/* =====================================================================
   STATE → SCREEN
   ===================================================================== */
function setState(s) {
  ui.state = s;
  if (ui.mode === 'local') LS.set('nl-local', s);
  if (ui.processing) { ui.pendingState = s; return; }
  process(s);
}
async function process(s) {
  ui.processing = true;
  try {
    await applyState(s);
  } catch (e) { console.error(e); }
  ui.processing = false;
  if (ui.pendingState) { const n = ui.pendingState; ui.pendingState = null; return process(n); }
  drive();
}

async function applyState(s) {
  if (ui.mode === 'online' && (s.status === 'closed' || ((s.status === 'lobby' || s.status === 'playing') && Date.now() - s.updatedAt > ABANDON_MS))) {
    const why = s.status === 'closed' ? (s.closedReason || 'This room has closed.') : 'This room was inactive for 30 minutes and has closed.';
    roomGone(s.code);
    stopOnline(); ui.state = null; ui.shown = null; LS.del('nl-last-room');
    closeModal(); showOnline(); toast(why);
    return;
  }
  noticeChat(s);
  noticeTrades(s);
  if (s.status === 'lobby' && ui.mode === 'online') { ui.shown = s; renderLobby(s); return; }

function placeTokens(s, movingId) {

  const b = buildBoard(s.settings.board), W = b.k + 2 * C_UNITS;
  const groups = {};
  s.players.forEach(p => {

    const pos = ui.view.pos[p.id] != null ? ui.view.pos[p.id] : p.pos;
    const jailed = p.inJail && pos === b.jail && movingId !== p.id;
    const key = pos + (jailed ? 'j' : '');
    (groups[key] = groups[key] || []).push(p);

  s.players.forEach(p => {
    const el = $(`.token[data-pid="${p.id}"]`, board);

    if (p.bankrupt) return;
    const pos = ui.view.pos[p.id] != null ? ui.view.pos[p.id] : p.pos;
    const jailed = p.inJail && pos === b.jail && movingId !== p.id;
    const g = groups[pos + (jailed ? 'j' : '')];
    const idx = g.indexOf(p), n = g.length;

    el.title = p.name;

}

function flyMoney(from, to, amt, delay) {
  return new Promise(res => {
    const notes = Math.min(7, 2 + Math.floor(amt / 120));
    let left = notes;
    for (let i = 0; i < notes; i++) {
      const n = document.createElement('div');
      n.className = 'note'; n.textContent = '₦';
      document.body.appendChild(n);
      const jx = (Math.random() - .5) * 40, jy = (Math.random() - .5) * 30, lift = 60 + Math.random() * 60;
      const midX = (from.x + to.x) / 2 + jx, midY = Math.min(from.y, to.y) - lift;
      const anim = n.animate([
        { transform: `translate(${from.x}px,${from.y}px) translate(-50%,-50%) rotate(${jx}deg) scale(.6)`, opacity: 0 },
        { transform: `translate(${from.x + jx * .3}px,${from.y + jy * .3}px) translate(-50%,-50%) rotate(${jx}deg) scale(1)`, opacity: 1, offset: .12 },
        { transform: `translate(${midX}px,${midY}px) translate(-50%,-50%) rotate(${-jx * 2}deg) scale(1.1)`, opacity: 1, offset: .55 },
        { transform: `translate(${to.x}px,${to.y}px) translate(-50%,-50%) rotate(0deg) scale(.5)`, opacity: .2 },
      ], { duration: 820, delay: delay + i * 90, easing: 'cubic-bezier(.4,0,.3,1)', fill: 'both' });
      anim.onfinish = () => { n.remove(); if (--left === 0) res(); };
    }
    if (!notes) res();
  });
}
async function flyAllMoney(s, pays) {
  const jobs = pays.slice(0, 8).map((pm, k) => {
    const from = moneySpot(s, pm.from, pm.src, typeof pm.src === 'number' ? pm.src : null);
    const to = moneySpot(s, pm.to, pm.dst, typeof pm.buy === 'number' ? pm.buy : null);
    if (from.card) pulseCard(from.card, 'loss', -pm.amt);
    const p = flyMoney(from, to, pm.amt, k * 160);
    p.then(() => { if (to.card) pulseCard(to.card, 'gain', pm.amt); });
    return p;
  });
  await Promise.all(jobs);
}

}

function propsTab(s, me) {

function tradeTab(s, me) {
  if (s.status !== 'playing') return '<div class="empty">Trading opens once the game starts.</div>';
  if (!me) return '<div class="empty">Spectators cannot trade.</div>';
  const p = P(s, me);
  const others = s.players.filter(o => o.id !== me && !o.bankrupt);
  if (ui.draft && ui.draft.counterOf && !s.trades.find(t => t.id === ui.draft.counterOf)) ui.draft = null;
  if (!ui.draft || ui.draft.from !== me) ui.draft = { from: me, to: (others[0] || {}).id, give: { cash: 0, props: [], cards: 0 }, get: { cash: 0, props: [], cards: 0 } };
  const d = ui.draft;
  if (!others.find(o => o.id === d.to)) d.to = (others[0] || {}).id;
  const o = P(s, d.to);
  const tradable = pid => ownedBy(s, pid).filter(t => !(t.type === 'prop' && groupHasHouses(s, t.group)));

      ${list.length ? list.map(t => `<label class="ck"><input type="checkbox" data-tp="${side}" value="${t.i}" ${off.props.includes(t.i) ? 'checked' : ''}><i style="background:${t.type === 'prop' ? GROUPS[t.group].color : '#9aa0c8'}"></i>${esc(t.name)}${s.props[t.i].mort ? ' (mortgaged)' : ''}</label>`).join('') : '<span class="small muted">No tradable property</span>'}

      ${who.jailCards.length ? `<label class="ck"><input type="checkbox" data-tcard="${side}" ${off.cards ? 'checked' : ''}>Get-out-of-${esc(J())} card</label>` : ''}
    </div>`;
  };
  const offers = s.trades.filter(t => t.from === me || t.to === me || ui.mode === 'local');
  const offerList = offers.map(t => {
    const a = P(s, t.from), b = P(s, t.to);
    const items = (off, who) => [off.cash ? fmt(off.cash) : '', ...off.props.map(i => T(s, i).name), off.cards ? 'Get-out-of-' + J() + ' card' : ''].filter(Boolean).map(x => `<li>${esc(x)}</li>`).join('') || '<li>Nothing</li>';
    const canAnswer = ui.mode === 'local' ? controls(t.to) : t.to === me;
    const canCancel = ui.mode === 'local' ? controls(t.from) : t.from === me;
    return `<div class="offer ${canAnswer ? 'in' : ''}"><b>${esc(a.name)} → ${esc(b.name)}</b>${t.counterOf ? ' <span class="chip y">Counter-offer</span>' : ''}
      <div class="tcols"><div><span class="lbl">${esc(a.name)} gives</span><ul>${items(t.give)}</ul></div><div><span class="lbl">${esc(b.name)} gives</span><ul>${items(t.get)}</ul></div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${canAnswer ? `<button class="btn small primary" data-trade="tradeAccept" data-id="${t.id}" data-by="${t.to}">${ui.mode === 'local' ? esc(b.name) + ' accepts' : 'Accept'}</button><button class="btn small green" data-counter="${t.id}">Counter</button><button class="btn small" data-trade="tradeDecline" data-id="${t.id}" data-by="${t.to}">Decline</button>` : ''}
      ${canCancel && !canAnswer ? `<button class="btn small ghost" data-trade="tradeDecline" data-id="${t.id}" data-by="${t.from}">Cancel offer</button>` : ''}</div></div>`;
  }).join('');
  if (!o) return `<div class="empty">No one left to trade with.</div>` + offerList;
  return `<div class="trade">
    ${offerList ? `<span class="lbl">Offers</span>${offerList}` : ''}
    ${d.counterOf ? `<div class="note" style="border-color:var(--danfo);color:var(--fg)">Counter-offer to <b>${esc(o.name)}</b>. Their offer is loaded below with the sides swapped. Change what you give or ask for, then send it back.<div style="margin-top:8px"><button class="btn ghost small" data-act="cancelCounter">Cancel counter-offer</button></div></div>` : '<span class="lbl">New offer</span>'}

function noticeTrades(s) {

  const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
  const b = $('button', m); if (b) b.focus();
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }

function showWinner(s) {
  const w = P(s, s.winner);
  const ranking = s.players.slice().sort((a, b) => (b.id === s.winner) - (a.id === s.winner));
  openModal(`<div class="win"><div class="trophy">🏆</div><h2>${esc(w ? w.name : '')} wins!</h2><p class="muted">The new Naija Landlord. Everyone else, pack your load.</p>

}

/* =====================================================================
   DRIVER: bots and auction timers
   ===================================================================== */
function drive() {
  clearTimeout(ui.auT); clearTimeout(ui.botT);
  const s = ui.state;
  if (!s || s.status !== 'playing' || ui.processing) return;
  const iDrive = ui.mode === 'local' || s.hostId === ui.me;
  const now = Date.now();
  if (s.auction) {
    const due = s.auction.endsAt - now;
    const c = cur(s);
    const mayEnd = iDrive || (c && c.id === ui.me) || due < -3500;
    if (due <= 0 && mayEnd) {
      if (ui.endingAuction !== s.auction.seq) {
        ui.endingAuction = s.auction.seq;
        dispatch({ type: 'auctionEnd', by: ui.me }, true).then(r => { if (r && r.error) { ui.endingAuction = null; ui.auT = setTimeout(drive, 800); } });
      }
    } else ui.auT = setTimeout(drive, Math.max(250, Math.min(due + 120, 1200)));
  }
  if (!iDrive) return;
  for (const b of s.players.filter(p => p.bot && !p.bankrupt)) {
    const a = botAction(s, b.id);
    if (!a) continue;
    const delay = a.type === 'bid' ? 900 + Math.random() * 1400 : a.type === 'roll' ? 900 : 750;
    const seq = s.seq;
    ui.botT = setTimeout(() => { if (ui.state && ui.state.seq === seq) dispatch(a, true); }, delay);
    return;
  }
}
