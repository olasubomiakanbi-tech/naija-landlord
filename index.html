<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1130"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Naija Landlord: a Nigerian property-trading board game. Play online with friends or pass-and-play.">
<meta property="og:title" content="Naija Landlord"><meta property="og:description" content="Buy Nigeria's landmarks, collect rent in Naira, and bankrupt your friends. Play online or on one device.">

<title>Naija Landlord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: a game table — players | board | controls on wide screens; board first, then stacked panels on phones.
   Look: adire-indigo night, danfo-yellow controls, flag-green board felt. Single committed dark look. */
:root{
  --ink:#0E1130; --ink-2:#161A45; --ink-3:#20255C; --ink-4:#2B3172; --line:#323A80;
  --fg:#F5F2E9; --muted:#AAB0DA; --faint:#7C83B8;
  --danfo:#F7C21A; --danfo-2:#FFD84D; --black:#141414;
  --naija:#0B8A4E; --naija-deep:#065A33; --naija-dark:#043A22;
  --tile:#FBF7EC; --tile-2:#F1EAD6; --tile-ink:#1A1D3B;
  --bad:#FF5C61; --good:#3DD68C; --wahala:#E2482F; --ajo:#0F8F57;
  --f-display:'Bungee', Impact, 'Arial Black', system-ui, sans-serif;
  --f-body:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:12px;
  color-scheme: dark;
}
html,body{height:100%}
body{
  margin:0; background-color:var(--ink); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.45;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(140,150,255,.09) 0 2.5px, transparent 3.5px),
    radial-gradient(circle at 0 0, rgba(140,150,255,.06) 0 9px, transparent 10px),
    repeating-linear-gradient(45deg, rgba(140,150,255,.035) 0 1px, transparent 1px 13px),
    repeating-linear-gradient(-45deg, rgba(140,150,255,.035) 0 1px, transparent 1px 13px);
  background-size: 26px 26px, 52px 52px, auto, auto;
  background-attachment: fixed;
}
*{box-sizing:border-box}
button,input,select{font:inherit; color:inherit}
h1,h2,h3{text-wrap:balance; margin:0}
:focus-visible{outline:3px solid var(--danfo); outline-offset:2px}
.screen{min-height:100%}

/* ---------- buttons ---------- */
.btn{appearance:none; border:0; cursor:pointer; background:var(--ink-4); color:var(--fg); font-weight:700;
  padding:.62em 1.05em; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; gap:.45em;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.28); transition: transform .08s, filter .15s; white-space:nowrap; font-size:.95rem}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42; cursor:not-allowed}
.btn.primary{background:var(--danfo); color:var(--black); box-shadow: inset 0 -5px 0 var(--black), 0 6px 18px rgba(247,194,26,.18)}
.btn.green{background:var(--naija); color:#fff; box-shadow: inset 0 -4px 0 var(--naija-dark)}
.btn.danger{background:#5A1E2E; color:#FFC9CB}
.btn.ghost{background:transparent; box-shadow:none; border:1.5px solid var(--line); color:var(--muted)}
.btn.small{padding:.38em .7em; font-size:.82rem; border-radius:8px}
.btn.big{padding:.85em 1.4em; font-size:1.05rem}
.btn.block{width:100%}

/* ---------- forms ---------- */
.field{display:grid; gap:.3rem}
.field label, .lbl{font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700}
.input{background:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:.6em .8em; width:100%; min-width:0}
.input:focus{border-color:var(--danfo); outline:none}
.toggle{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:.6rem 0; border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle b{display:block; font-size:.93rem}
.toggle small{color:var(--muted); font-size:.8rem}
.switch{position:relative; flex:none; width:44px; height:26px}
.switch input{opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; z-index:1}
.switch span{position:absolute; inset:0; background:var(--ink); border:1.5px solid var(--line); border-radius:99px; transition:.15s}
.switch span::after{content:''; position:absolute; top:3px; left:3px; width:17px; height:17px; border-radius:50%; background:var(--faint); transition:.15s}
.switch input:checked + span{background:var(--naija); border-color:var(--naija)}
.switch input:checked + span::after{left:21px; background:#fff}
.switch input:disabled{cursor:not-allowed}
.seg{display:inline-flex; background:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:3px; gap:3px; flex-wrap:wrap}
.seg button{border:0; background:transparent; padding:.4em .8em; border-radius:7px; cursor:pointer; color:var(--muted); font-weight:700; font-size:.88rem}
.seg button.on{background:var(--danfo); color:var(--black)}
.seg button:disabled{cursor:not-allowed}

/* ---------- home ---------- */
.home{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:32px 48px; display:grid; gap:34px}
.hero{display:grid; grid-template-columns: minmax(0,1.05fr) minmax(0,1fr); gap:40px; align-items:center}
.wordmark{font-family:var(--f-display); line-height:.92; font-size:clamp(2.6rem, 7vw, 5.4rem); letter-spacing:.01em}
.wordmark .w1{color:var(--fg); display:block}
.wordmark .w2{display:inline-block; background:var(--danfo); color:var(--black); padding:.06em .18em .02em; margin-top:.08em;
  box-shadow: 0 .14em 0 var(--black), 0 .26em 0 var(--danfo); transform:rotate(-1.5deg)}
.tagline{font-size:1.12rem; color:var(--muted); max-width:46ch; margin-top:26px}
.flagbar{display:flex; height:6px; width:120px; border-radius:3px; overflow:hidden; margin-top:36px}
.flagbar i{flex:1; background:var(--naija)} .flagbar i:nth-child(2){background:#fff}
.preview-wrap{justify-self:center; width:min(100%, 470px); transform: perspective(1200px) rotateX(16deg) rotateZ(-4deg); filter: drop-shadow(0 30px 40px rgba(0,0,0,.5))}
.modes{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px}
.mode{background:var(--ink-2); border:1.5px solid var(--line); border-radius:18px; padding:24px; display:grid; gap:14px; align-content:start}
.mode h2{font-family:var(--f-display); font-size:1.5rem; font-weight:400}
.mode p{margin:0; color:var(--muted)}
.mode .row{display:flex; gap:10px; flex-wrap:wrap}
.mode .kicker{font-size:.74rem; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:var(--danfo)}
.facts{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px}
.fact{border-top:2px solid var(--line); padding-top:10px}
.fact b{font-family:var(--f-display); font-weight:400; font-size:1.05rem; display:block}
.fact span{color:var(--muted); font-size:.88rem}

/* ---------- setup / lobby ---------- */
.page{max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:24px 48px; display:grid; gap:20px}
.topbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.topbar h1{font-family:var(--f-display); font-weight:400; font-size:clamp(1.4rem, 3.5vw, 2rem)}
.topbar .sp{flex:1}
.cols{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:20px; align-items:start}
.card{background:var(--ink-2); border:1.5px solid var(--line); border-radius:16px; padding:20px; display:grid; gap:14px; min-width:0}
.card h3{font-size:1.05rem}
.prow{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:10px; background:var(--ink); border-radius:12px; border:1.5px solid var(--line)}
.tok-pick{display:flex; gap:4px; flex-wrap:wrap}
.tok-pick button{width:34px; height:34px; border-radius:9px; border:1.5px solid var(--line); background:var(--ink-2); cursor:pointer; font-size:18px; display:grid; place-items:center; padding:0}
.tok-pick button.on{border-color:var(--danfo); background:var(--ink-4)}
.tok-pick button:disabled{opacity:.25; cursor:not-allowed}
.chip{display:inline-flex; align-items:center; gap:.3em; font-size:.72rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:.18em .5em; border-radius:6px; background:var(--ink-4); color:var(--muted)}
.chip.y{background:var(--danfo); color:var(--black)} .chip.g{background:var(--naija); color:#fff} .chip.r{background:#5A1E2E; color:#FFC9CB}
.avatar{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:20px; background:var(--tile); border:3px solid var(--pc, var(--danfo)); flex:none}
.code{font-family:var(--f-display); font-size:clamp(2rem, 6vw, 3rem); letter-spacing:.12em; color:var(--danfo)}
.rooms{display:grid; gap:8px}
.room{display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--ink); border:1.5px solid var(--line); border-radius:12px}
.room .grow{flex:1; min-width:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.note{background:var(--ink); border:1.5px dashed var(--line); border-radius:12px; padding:12px 14px; color:var(--muted); font-size:.9rem}

/* ---------- game layout ---------- */
#game{display:grid; grid-template-columns: 260px minmax(0,1fr) 350px; gap:16px; height:100%; padding-inline:16px; padding-block:12px}
#game > *{min-width:0; min-height:0}
.pane{display:flex; flex-direction:column; gap:12px; overflow:auto; scrollbar-width:thin}
.gbar{display:flex; align-items:center; gap:8px}
.gbar .mini{font-family:var(--f-display); font-size:1rem; line-height:1}
.gbar .mini span{background:var(--danfo); color:var(--black); padding:0 .2em}
.gbar .sp{flex:1}
.iconbtn{width:36px; height:36px; border-radius:10px; border:1.5px solid var(--line); background:var(--ink-2); cursor:pointer; display:grid; place-items:center; padding:0}
.iconbtn svg{width:18px; height:18px}
#boardWrap{display:flex; align-items:center; justify-content:center}

/* players */
.plist{display:grid; gap:8px}
.pl{position:relative; background:var(--ink-2); border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; transition:border-color .2s, transform .2s}
.pl.turn{border-color:var(--danfo); box-shadow:0 0 0 3px rgba(247,194,26,.18)}
.pl.turn::before{content:''; position:absolute; left:-1.5px; top:12px; bottom:12px; width:4px; border-radius:0 3px 3px 0; background:var(--danfo)}
.pl.out{opacity:.45}
.pl .nm{font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pl .cash{font-variant-numeric:tabular-nums; font-weight:800; font-size:1.05rem}
.pl .cash.neg{color:var(--bad)}
.pl .meta{display:flex; gap:4px; flex-wrap:wrap; margin-top:3px}
.sets{display:flex; gap:3px; flex-wrap:wrap; grid-column:1/-1}
.sets i{width:12px; height:8px; border-radius:2px; display:block; opacity:.95}
.pl .kick{position:absolute; right:6px; bottom:6px}

/* ---------- board ---------- */
.board{position:relative; aspect-ratio:1/1; width:min(100%, calc(100vh - 24px)); max-width:100%; container-type:inline-size; user-select:none; -webkit-user-select:none}
.board .frame{position:absolute; inset:0; border-radius:16px; background:var(--naija-dark); padding:3px; box-shadow:0 20px 50px rgba(0,0,0,.45), 0 0 0 2px #0a2a1a}
.board .grid{position:absolute; inset:3px; display:grid; gap:2px}
.tile{position:relative; background:var(--tile); color:var(--tile-ink); overflow:hidden; cursor:pointer; border-radius:2px}
.tile:hover{filter:brightness(1.04)}
.tile.owned{background:color-mix(in srgb, var(--own) 20%, var(--tile))}
.tile.hl{box-shadow: inset 0 0 0 3px var(--danfo)}
.t-in{position:absolute; inset:0; display:flex; flex-direction:column; align-items:stretch; text-align:center}
.side-l .t-in, .side-r .t-in{inset:auto; left:50%; top:50%; width:var(--u); height:calc(var(--u) * 1.6)}
.side-l .t-in{transform:translate(-50%,-50%) rotate(90deg)}
.side-r .t-in{transform:translate(-50%,-50%) rotate(-90deg)}
.side-t .t-in{flex-direction:column-reverse}
.band{flex:none; height:24%; background:var(--gc); display:flex; align-items:center; justify-content:center; gap:1px; position:relative; overflow:hidden}
.band::after{content:''; position:absolute; inset:0; opacity:.22; background:
  radial-gradient(circle at 25% 50%, #fff 0 12%, transparent 13%) 0 0/ calc(var(--u)*.34) 100%,
  linear-gradient(90deg, transparent 46%, rgba(0,0,0,.6) 46% 54%, transparent 54%) 0 0/ calc(var(--u)*.34) 100%}
.band .hs{position:relative; z-index:1; display:flex; gap:1px}
.house{width:calc(var(--u)*.15); height:calc(var(--u)*.15); background:#0E7A42; border:1px solid #fff; clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}
.hotel{width:calc(var(--u)*.42); height:calc(var(--u)*.18); background:#D4252D; border:1px solid #fff; border-radius:2px}
.t-name{flex:1; display:flex; align-items:center; justify-content:center; padding:1px 2px; font-size:calc(var(--u)*.155); line-height:1.08; font-weight:800; overflow:hidden; overflow-wrap:anywhere; hyphens:auto}
.t-price{flex:none; font-size:calc(var(--u)*.16); font-weight:800; padding-bottom:2px; font-variant-numeric:tabular-nums; color:#3c3f60}
.t-ico{flex:none; display:flex; justify-content:center; padding-top:2px}
.t-ico svg{width:calc(var(--u)*.52); height:calc(var(--u)*.52)}
.own{flex:none; height:9%; background:var(--own)}
.tile.mort .t-in > *{opacity:.35}
.tile.mort::after{content:'MORTGAGED'; position:absolute; inset:0; display:grid; place-items:center; font-size:calc(var(--u)*.13); font-weight:800; letter-spacing:.05em; color:#8a1c22; background:repeating-linear-gradient(45deg, rgba(212,37,45,.12) 0 4px, transparent 4px 8px)}
.tile.mort.side-l::after,.tile.mort.side-r::after{writing-mode:vertical-rl}
.compact .t-name{font-size:calc(var(--u)*.17)}
.tiny .t-name{display:none}
.tiny .t-price{font-size:calc(var(--u)*.24); flex:1; display:flex; align-items:center; justify-content:center}
.tiny .t-ico svg{width:calc(var(--u)*.6); height:calc(var(--u)*.6)}
.tiny .band{height:28%}
.corner{display:grid; place-items:center; text-align:center; padding:4px}
.corner .cn{font-family:var(--f-display); font-size:calc(var(--u)*.22); line-height:1; font-weight:400}
.corner .cs{font-size:calc(var(--u)*.13); font-weight:700; color:#555}
.corner svg{width:calc(var(--u)*.85); height:calc(var(--u)*.85)}
.c-go{background:linear-gradient(135deg, #FBF7EC 0 60%, #E7F5EC 60%)}
.c-go .cn{color:var(--naija-deep); font-size:calc(var(--u)*.3)}
.c-jail{background:var(--tile)}
.c-jail .cell{position:absolute; right:0; top:0; width:62%; height:62%; background:#F4A51C; border-left:3px solid #1A1D3B; border-bottom:3px solid #1A1D3B;
  background-image:repeating-linear-gradient(90deg, transparent 0 14%, rgba(26,29,59,.85) 14% 18%); display:grid; place-items:center}
.c-jail .cell b{font-family:var(--f-display); font-weight:400; font-size:calc(var(--u)*.18); background:#F4A51C; padding:0 3px; color:#1A1D3B}
.c-jail .vis{position:absolute; left:4px; bottom:4px; font-size:calc(var(--u)*.13); font-weight:800; color:#555; text-align:left; line-height:1.05}
.c-park{background:radial-gradient(circle at 30% 25%, #FFE58A 0 14%, transparent 15%), radial-gradient(circle at 75% 70%, #F7A8C9 0 10%, transparent 11%), var(--tile)}
.c-park .cn{color:#B3166A}
.c-park .pot{font-weight:800; font-size:calc(var(--u)*.2); color:var(--naija-deep)}
.c-gojail .cn{color:#1E3C8C}

/* center felt */
.center{position:absolute; border-radius:6px; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--u)*.22); padding:calc(var(--u)*.35); text-align:center;
  background-color:var(--naija);
  background-image:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 0 18%, transparent 19%),
    conic-gradient(from 45deg at 50% 50%, rgba(0,0,0,.08) 0 25%, transparent 0 50%, rgba(0,0,0,.08) 0 75%, transparent 0),
    radial-gradient(circle at 0 0, rgba(255,216,77,.18) 0 9%, transparent 10%);
  background-size: calc(var(--u)*1.4) calc(var(--u)*1.4);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.25), inset 0 0 60px rgba(0,0,0,.35)}
.c-logo{font-family:var(--f-display); line-height:.9; color:#fff; font-size:calc(var(--u)*.62); text-shadow:0 3px 0 rgba(0,0,0,.35)}
.c-logo span{display:inline-block; background:var(--danfo); color:var(--black); padding:0 .15em; margin-top:.06em; transform:rotate(-2deg); text-shadow:none; box-shadow:0 .1em 0 var(--black)}
.c-status{font-weight:800; color:#fff; font-size:max(13px, calc(var(--u)*.3)); text-shadow:0 1px 0 rgba(0,0,0,.4)}
.c-sub{color:#D7F3E3; font-size:max(12px, calc(var(--u)*.24))}
.c-actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.c-actions .btn{font-size:max(13px, calc(var(--u)*.27))}
.c-pot{display:inline-flex; gap:6px; align-items:center; background:rgba(0,0,0,.25); color:#FFE58A; border-radius:99px; padding:.2em .8em; font-weight:800; font-size:max(12px, calc(var(--u)*.24))}
.tiny .c-logo, .compact .c-logo{display:none}

/* dice */
.dice{display:flex; gap:calc(var(--u)*.35); perspective:600px}
.die{width:calc(var(--u)*.95); height:calc(var(--u)*.95); min-width:30px; min-height:30px; position:relative; transform-style:preserve-3d; transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.face{position:absolute; inset:0; background:#FFFDF6; border-radius:18%; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:14%; box-shadow:inset 0 -3px 0 rgba(0,0,0,.12), inset 0 0 0 1px rgba(0,0,0,.08); backface-visibility:hidden}
.face i{width:72%; height:72%; border-radius:50%; background:var(--black); place-self:center}
.face i.red{background:#C8102E}

/* tokens */
.tokens{position:absolute; inset:3px; pointer-events:none}
.token{position:absolute; width:max(20px, calc(var(--u)*.62)); height:max(20px, calc(var(--u)*.62)); border-radius:50%; background:#fff; border:3px solid var(--pc); display:grid; place-items:center;
  font-size:max(11px, calc(var(--u)*.34)); transform:translate(-50%,-50%); transition:left .17s ease, top .17s ease; box-shadow:0 4px 8px rgba(0,0,0,.45); z-index:2}
.token.me{box-shadow:0 0 0 3px rgba(255,255,255,.7), 0 4px 8px rgba(0,0,0,.45)}
.token.cur{z-index:3; animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-62%)}}
.float{position:absolute; transform:translate(-50%,-50%); font-weight:800; font-size:max(13px, calc(var(--u)*.3)); pointer-events:none; animation:floatup 1.6s ease-out forwards; z-index:5; text-shadow:0 2px 0 rgba(0,0,0,.6)}
.float.plus{color:#7CFFB7} .float.minus{color:#FF9EA1}
@keyframes floatup{from{opacity:0; margin-top:0} 15%{opacity:1} to{opacity:0; margin-top:calc(var(--u) * -1.2)}}

/* card pop */
.cardpop{position:absolute; inset:0; display:grid; place-items:center; z-index:6; pointer-events:none}
.gcard{pointer-events:auto; width:min(86%, calc(var(--u)*6)); border-radius:14px; padding:calc(var(--u)*.35); background:var(--tile); color:var(--tile-ink); box-shadow:0 20px 40px rgba(0,0,0,.5); animation:flipin .45s cubic-bezier(.2,.9,.3,1.2); display:grid; gap:8px; text-align:center}
.gcard .dk{font-family:var(--f-display); font-weight:400; color:#fff; border-radius:9px; padding:.25em; font-size:max(14px, calc(var(--u)*.34))}
.gcard.wahala .dk{background:var(--wahala)} .gcard.ajo .dk{background:var(--ajo)}
.gcard p{margin:0; font-weight:700; font-size:max(13px, calc(var(--u)*.27))}
@keyframes flipin{from{transform:rotateY(90deg) scale(.8); opacity:0} to{transform:none; opacity:1}}

/* auction */
.auction{width:100%; max-width:calc(var(--u)*7.2); background:rgba(4,40,24,.72); border:2px solid var(--danfo); border-radius:14px; padding:10px; display:grid; gap:8px; color:#fff}

/* ---------- 3. HELPERS ---------- */
function fmt(n) {
  const neg = n < 0; n = Math.abs(Math.round(n));
  let s;
  if (n >= 1000) {
    let v = (n / 1000).toFixed(2);
    v = v.replace(/0+$/, '').replace(/\.$/, '');
    s = '₦' + v + 'M';
  } else s = '₦' + n + 'k';
  return (neg ? '−' : '') + s;
}

const boardCache = {};
function buildBoard(key) {
  if (boardCache[key]) return boardCache[key];
  const def = BOARDS[key] || BOARDS.classic;
  const tiles = def.layout.map((k, i) => {
    if (PROPS[k]) {
      const p = PROPS[k];
      return { i, key: k, type: 'prop', name: LANDMARKS[k] || k, group: p.g, price: p.price, rent: p.rent, house: GROUPS[p.g].house };
    }
    if (k[0] === 't' && LANDMARKS[k] && !SPECIAL[k]) return { i, key: k, type: 'transport', name: LANDMARKS[k], price: 200 };
    if (k[0] === 'u' && LANDMARKS[k]) return { i, key: k, type: 'utility', name: LANDMARKS[k], price: 150 };
    const sp = SPECIAL[k];
    return Object.assign({ i, key: k }, sp);
  });
  const k = (tiles.length - 4) / 4;
  boardCache[key] = { key, tiles, n: tiles.length, k, jail: tiles.findIndex(t => t.type === 'jail'), def };
  return boardCache[key];
}

const B = s => buildBoard(s.settings.board);
const T = (s, i) => B(s).tiles[i];
const P = (s, id) => s.players.find(p => p.id === id);
const cur = s => P(s, s.order[s.turn]);
const active = s => s.players.filter(p => !p.bankrupt);
const isBuyable = t => t && (t.type === 'prop' || t.type === 'transport' || t.type === 'utility');
const r6 = () => 1 + Math.floor(Math.random() * 6);

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function log(s, m) { s.log.push({ t: s.now || Date.now(), m }); if (s.log.length > 70) s.log.splice(0, s.log.length - 70); }

function groupTiles(s, g) { return B(s).tiles.filter(t => t.type === 'prop' && t.group === g); }
function ownsGroup(s, pid, g) { return groupTiles(s, g).every(t => s.props[t.i] && s.props[t.i].owner === pid); }
function countOwned(s, pid, type) { return B(s).tiles.filter(t => t.type === type && s.props[t.i] && s.props[t.i].owner === pid).length; }
function ownedBy(s, pid) { return B(s).tiles.filter(t => s.props[t.i] && s.props[t.i].owner === pid); }
function groupHasHouses(s, g) { return groupTiles(s, g).some(t => s.props[t.i] && s.props[t.i].houses > 0); }

function rentFor(s, i, diceSum, cardMult) {
  const t = T(s, i), pr = s.props[i];
  if (!pr || pr.mort) return 0;
  if (t.type === 'prop') {
    if (pr.houses > 0) return t.rent[pr.houses];
    let r = t.rent[0];
    if (s.settings.doubleRent && ownsGroup(s, pr.owner, t.group)) r *= 2;
    return r;
  }
  if (t.type === 'transport') {
    const n = countOwned(s, pr.owner, 'transport');
    return 25 * Math.pow(2, n - 1) * (cardMult ? 2 : 1);
  }
  if (t.type === 'utility') {
    if (cardMult) return diceSum * 10;
    const n = countOwned(s, pr.owner, 'utility');
    return diceSum * (n >= 3 ? 20 : n === 2 ? 10 : 4);
  }
  return 0;
}

function propValue(s, i) {
  const t = T(s, i), pr = s.props[i];
  if (!pr) return t.price || 0;
  let v = t.price + (pr.houses || 0) * (t.house || 0);
  if (pr.mort) v -= t.price / 2;
  return v;
}

function canAct(s, a, pid) {
  if (s.mode === 'local') return true;
  if (a.actor === pid) return true;
  const p = P(s, pid);
  return !!(p && p.bot && a.actor === s.hostId);
}

/* ---------- 4. MONEY AND MOVEMENT ---------- */
function pay(s, p, amt, to, toPot) {
  if (amt <= 0) return;
  p.cash -= amt;
  if (to) to.cash += amt;
  else if (toPot && s.settings.vacationCash) s.pot += amt;
  if (p.cash < 0) p.debtTo = to ? to.id : null;
}

function moveBy(s, p, steps) {
  const n = B(s).n, from = p.pos;
  let to = ((from + steps) % n + n) % n;
  if (steps > 0 && from + steps >= n) {
    p.cash += SALARY;
    log(s, `${p.name} passed Start and collected ${fmt(SALARY)} salary.`);
  }
  p.pos = to;
  s.fx.moves.push({ pid: p.id, from, steps });
}

function moveForwardTo(s, p, dest) {
  const n = B(s).n;
  moveBy(s, p, ((dest - p.pos) % n + n) % n);
}

function sendJail(s, p) {
  const from = p.pos;
  p.pos = B(s).jail; p.inJail = true; p.jailTurns = 0; p.doubles = 0;
  s.fx.moves.push({ pid: p.id, from, to: p.pos, direct: true });
  if (cur(s) && cur(s).id === p.id) s.rollAgain = false;
}

function after(s) {
  const c = cur(s);
  if (!c || c.bankrupt) return 'done';
  return s.rollAgain && !c.inJail ? 'roll' : 'done';
}

function land(s, p, opts) {
  opts = opts || {};
  const t = T(s, p.pos);
  const dice = s.dice[0] + s.dice[1];
  switch (t.type) {
    case 'prop': case 'transport': case 'utility': {
      const pr = s.props[p.pos];
      if (!pr) { s.phase = 'buy'; s.pending = { i: p.pos, cardMult: !!opts.cardMult }; return; }
      if (pr.owner === p.id) return;
      if (pr.mort) { log(s, `${t.name} is mortgaged. No rent.`); return; }
      const owner = P(s, pr.owner);
      if (!owner || owner.bankrupt) return;
      if (owner.inJail && s.settings.noRentInJail) { log(s, `${owner.name} is in Kirikiri, so ${p.name} pays no rent.`); return; }
      const rent = rentFor(s, p.pos, dice, opts.cardMult);
      pay(s, p, rent, owner);
      s.fx.pays.push({ from: p.id, to: owner.id, amt: rent });
      log(s, `${p.name} paid ${fmt(rent)} rent to ${owner.name} for ${t.name}.`);
      return;
    }
    case 'tax':
      pay(s, p, t.amount, null, true);
      s.fx.pays.push({ from: p.id, to: null, amt: t.amount });
      log(s, `${p.name} paid ${fmt(t.amount)} ${t.name}.`);
      return;
    case 'wahala': case 'ajo':
      drawCard(s, p, t.type);
      return;
    case 'gojail':
      sendJail(s, p);
      log(s, `${p.name} was sent to Kirikiri.`);
      return;
    case 'park':
      if (s.settings.vacationCash && s.pot > 0) {
        log(s, `${p.name} collected the Owambe pot of ${fmt(s.pot)}!`);
        s.fx.pays.push({ from: null, to: p.id, amt: s.pot });
        p.cash += s.pot; s.pot = 0;
      }
      return;
  }
}

function drawCard(s, p, deck) {
  if (!s.decks[deck] || !s.decks[deck].length) s.decks[deck] = shuffle(CARDS[deck].map((_, i) => i));
  const idx = s.decks[deck].shift();
  const card = CARDS[deck][idx];
  if (card.fx.t !== 'jailFree') s.decks[deck].push(idx);
  s.cardSeq = (s.cardSeq || 0) + 1;
  s.card = { deck, idx, seq: s.cardSeq, pid: p.id };
  log(s, `${p.name} drew ${deck === 'wahala' ? 'Wahala' : 'Ajo'}: “${card.text}”`);
  const fx = card.fx;
  switch (fx.t) {
    case 'move': {
      let dest = B(s).tiles.findIndex(t => t.key === fx.to);
      if (dest < 0) dest = 0;
      moveForwardTo(s, p, dest); land(s, p); return;
    }
    case 'nearest': {
      const n = B(s).n;
      let d = p.pos;
      for (let k = 1; k <= n; k++) { const j = (p.pos + k) % n; if (T(s, j).type === fx.kind) { d = j; break; } }
      moveForwardTo(s, p, d); land(s, p, { cardMult: true }); return;
    }
    case 'back': moveBy(s, p, -fx.n); land(s, p); return;
    case 'jail': sendJail(s, p); return;
    case 'jailFree': p.jailCards.push(deck); return;
    case 'money':
      if (fx.n > 0) { p.cash += fx.n; s.fx.pays.push({ from: null, to: p.id, amt: fx.n }); }
      else { pay(s, p, -fx.n, null, true); s.fx.pays.push({ from: p.id, to: null, amt: -fx.n }); }
      return;
    case 'each':
      active(s).forEach(o => { if (o.id !== p.id) pay(s, p, fx.n, o); });
      return;
    case 'fromEach':
      active(s).forEach(o => { if (o.id !== p.id) pay(s, o, fx.n, p); });
      return;
    case 'repairs': {
      let total = 0;
      ownedBy(s, p.id).forEach(t => { const h = s.props[t.i].houses || 0; total += h === 5 ? fx.hotel : h * fx.house; });
      if (total > 0) { pay(s, p, total, null, true); log(s, `${p.name} paid ${fmt(total)} for repairs.`); }
      return;
    }
  }
}

function nextTurn(s) {
  const c = cur(s);
  if (c) c.doubles = 0;
  s.rollAgain = false; s.pending = null;
  if (active(s).length <= 1) return;
  let t = s.turn;
  for (let k = 0; k < s.order.length; k++) {
    t = (t + 1) % s.order.length;
    const p = P(s, s.order[t]);
    if (p && !p.bankrupt) break;
  }
  s.turn = t; s.phase = 'roll';
  s.turnStarted = s.now; s.turnCount = (s.turnCount || 0) + 1;
}

function goBankrupt(s, p, reason) {
  if (p.bankrupt) return;
  const cred = p.cash < 0 && p.debtTo ? P(s, p.debtTo) : null;
  const heir = cred && !cred.bankrupt ? cred : null;
  ownedBy(s, p.id).forEach(t => {
    const pr = s.props[t.i];
    if (heir) { pr.owner = heir.id; pr.houses = 0; }
    else delete s.props[t.i];
  });
  p.jailCards.forEach(d => s.decks[d].push(CARDS[d].findIndex(c => c.fx.t === 'jailFree')));
  p.jailCards = [];
  p.bankrupt = true; p.cash = 0; p.inJail = false;
  s.trades = s.trades.filter(tr => tr.from !== p.id && tr.to !== p.id);
  if (s.auction && s.auction.by === p.id) { s.auction.by = null; s.auction.high = 0; }
  log(s, heir ? `${p.name} went bankrupt. ${heir.name} takes their properties.` : `${p.name} ${reason || 'went bankrupt'}. Their properties go back to the bank.`);
  const c = cur(s);
  if (c && c.id === p.id && !s.auction) nextTurn(s);
}

function checkWinner(s) {
  if (s.status !== 'playing') return;
  const a = active(s);
  if (a.length === 1) {
    s.status = 'ended'; s.winner = a[0].id; s.phase = 'over';
    log(s, `${a[0].name} is the Naija Landlord! 🏆`);
  }
}

/* ---------- 5. BUILD / MORTGAGE CHECKS ---------- */
function buildCheck(s, pid, i) {
  const t = T(s, i), pr = s.props[i], p = P(s, pid);
  if (!t || t.type !== 'prop' || !pr || pr.owner !== pid) return 'You do not own this property.';
  if (!ownsGroup(s, pid, t.group)) return 'You need the full colour set first.';
  if (groupTiles(s, t.group).some(g => s.props[g.i].mort)) return 'Pay off mortgages in this set first.';
  if (pr.houses >= 5) return 'This property already has a hotel.';
  if (s.settings.evenBuild) {
    const min = Math.min(...groupTiles(s, t.group).map(g => s.props[g.i].houses));
    if (pr.houses > min) return 'Build evenly across the set.';
  }
  if (p.cash < t.house) return 'Not enough cash.';
  return null;
}
function sellCheck(s, pid, i) {
  const t = T(s, i), pr = s.props[i];
  if (!pr || pr.owner !== pid || !pr.houses) return 'No buildings to sell here.';
  if (s.settings.evenBuild) {
    const max = Math.max(...groupTiles(s, t.group).map(g => s.props[g.i].houses));
    if (pr.houses < max) return 'Sell evenly across the set.';
  }
  return null;
}
function mortgageCheck(s, pid, i) {
  const t = T(s, i), pr = s.props[i];
  if (!s.settings.mortgage) return 'Mortgages are turned off in this game.';
  if (!pr || pr.owner !== pid) return 'You do not own this property.';
  if (pr.mort) return 'Already mortgaged.';
  if (t.type === 'prop' && groupHasHouses(s, t.group)) return 'Sell the buildings in this set first.';
  return null;
}
const unmortgageCost = t => Math.ceil(t.price / 2 * 1.1);
function unmortgageCheck(s, pid, i) {
  const t = T(s, i), pr = s.props[i], p = P(s, pid);
  if (!pr || pr.owner !== pid || !pr.mort) return 'Not mortgaged.';
  if (p.cash < unmortgageCost(t)) return 'Not enough cash.';
  return null;
}

/* ---------- 6. ACTIONS ---------- */
const ACTIONS = {
  join(s, a) {
    if (s.status !== 'lobby') return 'This game has already started.';
    const name = String(a.name || '').trim().slice(0, 18) || 'Player';
    let ex = P(s, a.by);
    const taken = s.players.filter(p => p.id !== a.by).map(p => p.token);
    let token = TOKENS.some(t => t.e === a.token) && !taken.includes(a.token) ? a.token : (TOKENS.find(t => !taken.includes(t.e)) || TOKENS[0]).e;
    if (ex) { ex.name = name; ex.token = token; return; }
    if (s.players.length >= s.settings.maxPlayers) return 'This room is full.';
    s.players.push(newPlayer(s, a.by, name, token, !!a.bot));
    s.playerIds = s.players.map(p => p.id);
    log(s, `${name} joined.`);
  },
  addBot(s, a) {
    if (s.mode !== 'local' && a.actor !== s.hostId) return 'Only the host can add bots.';
    if (s.status !== 'lobby') return 'Game already started.';
    if (s.players.length >= s.settings.maxPlayers) return 'The room is full.';
    const used = s.players.map(p => p.name);
    const nm = BOT_NAMES.find(n => !used.includes(n + ' (bot)')) || 'Bot';
    const taken = s.players.map(p => p.token);
    const tok = (TOKENS.find(t => !taken.includes(t.e)) || TOKENS[0]).e;
    const id = 'bot_' + Math.random().toString(36).slice(2, 8);
    s.players.push(newPlayer(s, id, nm + ' (bot)', tok, true));
    s.playerIds = s.players.map(p => p.id);
  },
  removePlayer(s, a) {
    if (s.status !== 'lobby') return 'Game already started.';
    if (s.mode !== 'local' && a.actor !== s.hostId && a.actor !== a.target) return 'Only the host can remove players.';
    if (a.target === s.hostId && s.mode !== 'local') return 'The host cannot leave the lobby this way.';
    s.players = s.players.filter(p => p.id !== a.target);
    s.playerIds = s.players.map(p => p.id);
    s.players.forEach((p, i) => p.color = PLAYER_COLORS[i % PLAYER_COLORS.length]);
  },
  settings(s, a) {
    if (s.mode !== 'local' && a.actor !== s.hostId) return 'Only the host can change settings.';
    if (s.status !== 'lobby') return 'Game already started.';
    const n = Object.assign({}, s.settings, a.settings);
    n.maxPlayers = Math.max(2, Math.min(8, n.maxPlayers | 0));
    n.startCash = Math.max(500, Math.min(5000, n.startCash | 0));
    if (!BOARDS[n.board]) n.board = 'classic';
    s.settings = n;
  },
  start(s, a) {
    if (s.mode !== 'local' && a.actor !== s.hostId) return 'Only the host can start the game.';
    if (s.status !== 'lobby') return 'Game already started.';
    if (s.players.length < 2) return 'You need at least 2 players.';
    s.players.forEach((p, i) => Object.assign(p, {
      cash: s.settings.startCash, pos: 0, inJail: false, jailTurns: 0, jailCards: [], doubles: 0, bankrupt: false, debtTo: null,
      color: PLAYER_COLORS[i % PLAYER_COLORS.length],
    }));
    s.order = s.players.map(p => p.id);
    if (s.settings.randomOrder) shuffle(s.order);
    s.turn = 0; s.phase = 'roll'; s.props = {}; s.pot = 0; s.trades = []; s.auction = null; s.pending = null; s.winner = null; s.card = null;
    s.decks = { wahala: shuffle(CARDS.wahala.map((_, i) => i)), ajo: shuffle(CARDS.ajo.map((_, i) => i)) };
    s.status = 'playing'; s.turnStarted = s.now;
    log(s, `Game on! ${cur(s).name} rolls first.`);
  },
  roll(s, a) {
    const p = cur(s);
    if (!p || p.id !== a.by || !canAct(s, a, a.by)) return 'It is not your turn.';
    if (s.phase !== 'roll') return 'You cannot roll right now.';
    if (p.cash < 0) return 'Clear your debt before rolling.';
    const d1 = r6(), d2 = r6(); s.dice = [d1, d2]; s.rollSeq++;
    const dbl = d1 === d2, sum = d1 + d2;
    s.phase = 'landing';
    if (p.inJail) {
      if (dbl) {
        p.inJail = false; p.jailTurns = 0; s.rollAgain = false;
        log(s, `${p.name} rolled doubles and walked out of Kirikiri.`);
      } else {
        p.jailTurns++;
        if (p.jailTurns >= 3) {
          pay(s, p, JAIL_FINE, null, true); p.inJail = false; p.jailTurns = 0; s.rollAgain = false;
          log(s, `${p.name} paid the ${fmt(JAIL_FINE)} fine after 3 tries and left Kirikiri.`);
        } else {
          s.rollAgain = false; s.phase = 'done';
          log(s, `${p.name} rolled ${d1} and ${d2}. Still in Kirikiri.`);
          return;
        }
      }
      moveBy(s, p, sum); land(s, p);
    } else {
      if (dbl) {
        p.doubles++;
        if (p.doubles >= 3) {
          log(s, `${p.name} rolled doubles three times. Off to Kirikiri!`);
          sendJail(s, p); s.phase = 'done'; return;
        }
        s.rollAgain = true;
      } else s.rollAgain = false;
      log(s, `${p.name} rolled ${d1} + ${d2}${dbl ? ' (doubles!)' : ''}.`);
      moveBy(s, p, sum); land(s, p);
    }
    if (s.phase === 'landing') s.phase = after(s);
  },
  buy(s, a) {
    const p = cur(s);
    if (!p || p.id !== a.by || !canAct(s, a, a.by)) return 'It is not your turn.';
    if (s.phase !== 'buy' || !s.pending) return 'Nothing to buy.';
    const t = T(s, s.pending.i);
    if (p.cash < t.price) return 'Not enough cash.';
    p.cash -= t.price;
    s.props[t.i] = { owner: p.id, houses: 0, mort: false };
    log(s, `${p.name} bought ${t.name} for ${fmt(t.price)}.`);
    s.pending = null; s.phase = after(s);
  },
  decline(s, a) {
    const p = cur(s);
    if (!p || p.id !== a.by || !canAct(s, a, a.by)) return 'It is not your turn.';
    if (s.phase !== 'buy' || !s.pending) return 'Nothing to decline.';
    const t = T(s, s.pending.i);
    s.pending = null;
    if (s.settings.auction && active(s).length > 1) {
      s.auctionSeq = (s.auctionSeq || 0) + 1;
      s.auction = { i: t.i, high: 0, by: null, endsAt: s.now + 12000, seq: s.auctionSeq };
      s.phase = 'auction';
      log(s, `${t.name} is up for auction!`);
    } else {
      log(s, `${p.name} passed on ${t.name}.`);
      s.phase = after(s);
    }
  },
  bid(s, a) {
    const au = s.auction;
    if (!au) return 'No auction running.';
    const p = P(s, a.by);
    if (!p || p.bankrupt || !canAct(s, a, a.by)) return 'You cannot bid.';
    const amt = Math.floor(a.amount);
    if (s.now > au.endsAt + 400) return 'The auction has closed.';
    if (!(amt > au.high)) return 'Bid higher than the current bid.';
    if (amt > p.cash) return 'You do not have that much cash.';
    au.high = amt; au.by = p.id;
    au.endsAt = Math.max(au.endsAt, s.now + 6000);
    au.bids = (au.bids || 0) + 1;
  },
  auctionEnd(s, a) {
    const au = s.auction;
    if (!au) return 'No auction.';
    if (s.now < au.endsAt) return 'Auction still running.';
    const t = T(s, au.i);
    const w = au.by && P(s, au.by);
    if (w && !w.bankrupt && w.cash >= au.high) {
      w.cash -= au.high;
      s.props[t.i] = { owner: w.id, houses: 0, mort: false };
      log(s, `${w.name} won ${t.name} at auction for ${fmt(au.high)}.`);
    } else log(s, `Nobody bought ${t.name}. It stays with the bank.`);
    s.auction = null;
    const c = cur(s);
    if (c && c.bankrupt) nextTurn(s); else s.phase = after(s);
  },
  payJail(s, a) {
    const p = cur(s);
    if (!p || p.id !== a.by || !canAct(s, a, a.by)) return 'It is not your turn.';
    if (!p.inJail || s.phase !== 'roll') return 'You can only pay the fine before rolling.';
    if (p.cash < JAIL_FINE) return 'Not enough cash.';
    pay(s, p, JAIL_FINE, null, true);
    p.inJail = false; p.jailTurns = 0;
    log(s, `${p.name} paid ${fmt(JAIL_FINE)} bail and left Kirikiri.`);
  },
  useJailCard(s, a) {
    const p = cur(s);
    if (!p || p.id !== a.by || !canAct(s, a, a.by)) return 'It is not your turn.';
    if (!p.inJail || !p.jailCards.length || s.phase !== 'roll') return 'You cannot use a card now.';
    const d = p.jailCards.pop();
    s.decks[d].push(CARDS[d].findIndex(c => c.fx.t === 'jailFree'));
    p.inJail = false; p.jailTurns = 0;
    log(s, `${p.name} used a get-out-of-Kirikiri card.`);
  },
  build(s, a) {
    const p = P(s, a.by);
    if (!p || !canAct(s, a, a.by)) return 'Not allowed.';
    if (cur(s).id !== p.id) return 'You can only build on your turn.';
    if (s.auction) return 'Wait for the auction to finish.';
    const e = buildCheck(s, p.id, a.i); if (e) return e;
    const t = T(s, a.i);
    p.cash -= t.house; s.props[a.i].houses++;
    log(s, `${p.name} built ${s.props[a.i].houses === 5 ? 'a hotel' : 'a house'} on ${t.name}.`);
  },
  sell(s, a) {
    const p = P(s, a.by);
    if (!p || !canAct(s, a, a.by)) return 'Not allowed.';
    const e = sellCheck(s, p.id, a.i); if (e) return e;
    const t = T(s, a.i);
    const was = s.props[a.i].houses;
    s.props[a.i].houses--; p.cash += t.house / 2;
    log(s, `${p.name} sold ${was === 5 ? 'a hotel' : 'a house'} on ${t.name} for ${fmt(t.house / 2)}.`);
  },
  mortgage(s, a) {
    const p = P(s, a.by);
    if (!p || !canAct(s, a, a.by)) return 'Not allowed.';
    const e = mortgageCheck(s, p.id, a.i); if (e) return e;
    const t = T(s, a.i);
    s.props[a.i].mort = true; p.cash += t.price / 2;
    log(s, `${p.name} mortgaged ${t.name} for ${fmt(t.price / 2)}.`);
  },
  unmortgage(s, a) {
    const p = P(s, a.by);
    if (!p || !canAct(s, a, a.by)) return 'Not allowed.';
    if (cur(s).id !== p.id) return 'You can only pay off mortgages on your turn.';
    const e = unmortgageCheck(s, p.id, a.i); if (e) return e;
    const t = T(s, a.i);
    p.cash -= unmortgageCost(t); s.props[a.i].mort = false;
    log(s, `${p.name} paid off the mortgage on ${t.name}.`);
  },
  endTurn(s, a) {
    const p = cur(s);
    if (!p || p.id !== a.by || !canAct(s, a, a.by)) return 'It is not your turn.';
    if (s.phase !== 'done') return s.phase === 'roll' ? 'Roll the dice first.' : 'Finish this step first.';
    if (p.cash < 0) return 'You are in debt. Sell or mortgage, or declare bankruptcy.';
    nextTurn(s);
  },
  bankrupt(s, a) {
    const p = P(s, a.by);
    if (!p || p.bankrupt || !canAct(s, a, a.by)) return 'Not allowed.';
    goBankrupt(s, p, p.cash < 0 ? 'went bankrupt' : 'left the game');
  },
  kick(s, a) {
    if (s.mode !== 'local' && a.actor !== s.hostId) return 'Only the host can do that.';
    const p = P(s, a.target);
    if (!p || p.bankrupt) return 'Player not found.';
    p.cash = Math.max(p.cash, 0);
    goBankrupt(s, p, 'was removed by the host');
  },
  tradePropose(s, a) {
    const p = P(s, a.by), o = P(s, a.to);
    if (!p || !o || p.bankrupt || o.bankrupt || p.id === o.id || !canAct(s, a, a.by)) return 'Pick another player to trade with.';
    if (s.status !== 'playing') return 'Game is not running.';
    const give = cleanOffer(a.give), get = cleanOffer(a.get);
    if (!give.cash && !give.props.length && !give.cards && !get.cash && !get.props.length && !get.cards) return 'Add something to the trade.';
    const e = offerCheck(s, p, give) || offerCheck(s, o, get); if (e) return e;
    s.tradeSeq = (s.tradeSeq || 0) + 1;
    s.trades.push({ id: 't' + s.tradeSeq, from: p.id, to: o.id, give, get, t: s.now });
    p.lastAsk = s.turnCount || 0;
    if (s.trades.length > 12) s.trades.shift();
    log(s, `${p.name} offered a trade to ${o.name}.`);
  },
  tradeAccept(s, a) {
    const tr = s.trades.find(t => t.id === a.id);
    if (!tr || tr.to !== a.by || !canAct(s, a, a.by)) return 'Trade not found.';
    const p = P(s, tr.from), o = P(s, tr.to);
    const e = offerCheck(s, p, tr.give) || offerCheck(s, o, tr.get);
    if (e) { s.trades = s.trades.filter(t => t !== tr); log(s, `Trade between ${p.name} and ${o.name} fell through: ${e}`); return; }
    transfer(s, p, o, tr.give); transfer(s, o, p, tr.get);
    s.trades = s.trades.filter(t => t !== tr);
    log(s, `${o.name} accepted ${p.name}'s trade.`);
  },
  tradeDecline(s, a) {
    const tr = s.trades.find(t => t.id === a.id);
    if (!tr || (tr.to !== a.by && tr.from !== a.by) || !canAct(s, a, a.by)) return 'Trade not found.';
    s.trades = s.trades.filter(t => t !== tr);
    log(s, tr.to === a.by ? `${P(s, a.by).name} declined a trade.` : `${P(s, a.by).name} cancelled a trade.`);
  },
  chat(s, a) {
    const p = P(s, a.by);

function completesGroup(s, pid, i) {

}
function botRaise(s, p) {

  if (m.length) return { type: 'mortgage', by: p.id, i: m[0].i };
  return null;
}
function botBuild(s, p) {
  const opts = ownedBy(s, p.id).filter(t => t.type === 'prop' && !buildCheck(s, p.id, t.i) && p.cash - t.house >= 150 + t.house);
  opts.sort((a, b) => s.props[a.i].houses - s.props[b.i].houses || b.price - a.price);
  return opts.length ? { type: 'build', by: p.id, i: opts[0].i } : null;
}
function botUnmortgage(s, p) {
  const m = ownedBy(s, p.id).filter(t => !unmortgageCheck(s, p.id, t.i) && p.cash - unmortgageCost(t) > 400);
  return m.length ? { type: 'unmortgage', by: p.id, i: m[0].i } : null;
}
function botTradeOk(s, p, tr) {
  const asker = P(s, tr.from);
  const val = (off, giving) => off.cash + off.cards * 50 + off.props.reduce((a, i) => a + propValue(s, i) * (giving ? (completesGroup(s, asker.id, i) ? 1.6 : 1) : (completesGroup(s, p.id, i) ? 1.8 : 1)), 0);
  const giving = tr.get, getting = tr.give;
  for (const i of giving.props) { const t = T(s, i); if (t.type === 'prop' && ownsGroup(s, p.id, t.group)) return false; }
  if (giving.cash > p.cash - 100) return false;
  return val(getting, false) >= val(giving, true) * 1.15 + 10;
}
function botProposeTrade(s, p) {
  if (s.trades.some(t => t.from === p.id)) return null;
  if ((s.turnCount || 0) - (p.lastAsk || -99) < s.players.length * 3) return null;
  for (const g of Object.keys(GROUPS)) {
    const tiles = groupTiles(s, g);
    if (!tiles.length) continue;
    const mine = tiles.filter(t => s.props[t.i] && s.props[t.i].owner === p.id);
    const missing = tiles.filter(t => !(s.props[t.i] && s.props[t.i].owner === p.id));
    if (mine.length < tiles.length - 1 || missing.length !== 1) continue;
    const t = missing[0], pr = s.props[t.i];
    if (!pr) continue;
    const o = P(s, pr.owner);
    if (!o || o.bankrupt || o.id === p.id) continue;
    if (groupHasHouses(s, g)) continue;
    const offer = Math.round(t.price * 2 / 10) * 10;
    if (p.cash - offer < 150) continue;
    return { type: 'tradePropose', by: p.id, to: o.id, give: { cash: offer, props: [], cards: 0 }, get: { cash: 0, props: [t.i], cards: 0 } };
  }

}
function botAction(s, bid) {
  const p = P(s, bid);
  if (!p || p.bankrupt || s.status !== 'playing') return null;
  const tr = s.trades.find(t => t.to === bid);
  if (tr) return { type: botTradeOk(s, p, tr) ? 'tradeAccept' : 'tradeDecline', by: bid, id: tr.id };
  if (s.auction) {
    const a = s.auction;
    if (a.by === bid) return null;
    const t = T(s, a.i);
    const want = t.price * (completesGroup(s, bid, a.i) ? 1.7 : (p.cash > 900 ? 1.15 : 0.9));
    const step = a.high < 100 ? 10 : a.high < 400 ? 20 : 50;
    const next = Math.max(a.high + step, a.high === 0 ? Math.round(t.price * 0.4 / 10) * 10 || 10 : 0);
    if (next <= want && next <= p.cash - 60) return { type: 'bid', by: bid, amount: next };
    return null;
  }
  const c = cur(s);
  if (!c || c.id !== bid) return null;
  if (p.cash < 0) return botRaise(s, p) || { type: 'bankrupt', by: bid };
  if (s.phase === 'roll') {
    if (p.inJail) {
      if (p.jailCards.length) return { type: 'useJailCard', by: bid };

      if (p.cash >= 300 && unowned > 6) return { type: 'payJail', by: bid };
    }
    return botBuild(s, p) || botProposeTrade(s, p) || { type: 'roll', by: bid };

    const t = T(s, s.pending.i);
    const reserve = completesGroup(s, bid, t.i) ? 0 : 100;
    return { type: p.cash - t.price >= reserve ? 'buy' : 'decline', by: bid };
  }
  if (s.phase === 'done') return botBuild(s, p) || botUnmortgage(s, p) || { type: 'endTurn', by: bid };
  return null;
}

function tilePlace(i, k) {
  const C = C_UNITS, W = k + 2 * C;
  if (i === 0) return { r: k + 2, c: k + 2, side: 'corner', x: W - C / 2, y: W - C / 2 };
  if (i <= k) return { r: k + 2, c: k - i + 2, side: 'b', x: C + (k - i) + .5, y: W - C / 2 };
  if (i === k + 1) return { r: k + 2, c: 1, side: 'corner', x: C / 2, y: W - C / 2 };
  if (i <= 2 * k + 1) { const m = i - (k + 1); return { r: k - m + 2, c: 1, side: 'l', x: C / 2, y: C + (k - m) + .5 }; }
  if (i === 2 * k + 2) return { r: 1, c: 1, side: 'corner', x: C / 2, y: C / 2 };
  if (i <= 3 * k + 2) { const m = i - (2 * k + 2); return { r: 1, c: m + 1, side: 't', x: C + (m - 1) + .5, y: C / 2 }; }
  if (i === 3 * k + 3) return { r: 1, c: k + 2, side: 'corner', x: W - C / 2, y: C / 2 };
  const m = i - (3 * k + 3); return { r: m + 1, c: k + 2, side: 'r', x: W - C / 2, y: C + (m - 1) + .5 };
}

const boardObservers = new WeakMap();
function mountBoard(el) {
  if (!el || boardObservers.has(el)) return;
  const W = +el.dataset.w;
  const fit = () => {
    const w = el.clientWidth - 6;
    if (!w) return;
    const u = w / W;
    el.style.setProperty('--u', u.toFixed(2) + 'px');
    el.classList.toggle('compact', u < 50);
    el.classList.toggle('tiny', u < 35);
  };
  const ro = new ResizeObserver(fit); ro.observe(el); fit();
  boardObservers.set(el, ro);
}

/* ---------------- dice ---------------- */
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const FACE_T = { 1: '', 6: 'rotateY(180deg)', 2: 'rotateY(90deg)', 5: 'rotateY(-90deg)', 3: 'rotateX(90deg)', 4: 'rotateX(-90deg)' };
const SHOW = { 1: [0, 0], 6: [0, -180], 2: [0, -90], 5: [0, 90], 3: [-90, 0], 4: [90, 0] };
function dieHTML() {
  return `<div class="die" style="--d:max(30px, calc(var(--u)*.95))">${[1, 2, 3, 4, 5, 6].map(v =>
    `<div class="face" style="transform:${FACE_T[v]} translateZ(calc(var(--d) / 2))">${Array.from({ length: 9 }, (_, i) => PIPS[v].includes(i) ? `<i${v === 1 ? ' class="red"' : ''}></i>` : '<span></span>').join('')}</div>`).join('')}</div>`;
}
function setDice(root, vals, spins) {
  $$('.die', root).forEach((d, k) => {
    const [x, y] = SHOW[vals[k]] || [0, 0];
    const sx = spins * 360 + (k ? 360 : 0), sy = spins * 360;
    d.style.transform = `rotateX(${x - sx}deg) rotateY(${y + sy}deg)`;
    d.style.width = d.style.height = 'var(--d)';
  });
}

async function loadRooms() {
  if (!onlineOK()) return;
  ui.rooms = null; const el = $('#roomList'); if (el) el.innerHTML = roomsHTML();
  try {
    const cutoff = Date.now() - 6 * 3600 * 1000;
    const [open, mine] = await Promise.all([
      ui.db.collection('games').where('status', '==', 'lobby').limit(40).get(),
      ui.db.collection('games').where('playerIds', 'array-contains', ui.me).limit(40).get(),
    ]);
    const map = new Map();
    open.docs.forEach(d => { const v = d.data(); if (v && v.updatedAt > cutoff) map.set(v.code, Object.assign({ mine: false }, v)); });
    mine.docs.forEach(d => { const v = d.data(); if (v && v.status !== 'ended' && v.updatedAt > cutoff - 18 * 3600 * 1000) map.set(v.code, Object.assign({}, v, { mine: true })); });
    ui.rooms = Array.from(map.values()).sort((a, b) => (b.mine - a.mine) || b.updatedAt - a.updatedAt).slice(0, 15);
  } catch (e) { ui.rooms = []; }
  const el2 = $('#roomList'); if (el2) el2.innerHTML = roomsHTML();
}
function readMe() {
  const n = $('#myName'); if (n) ui.prefs.name = n.value.trim().slice(0, 18);
  savePrefs();
  return { name: ui.prefs.name || 'Player', token: ui.prefs.token };
}
function savePrefs() { LS.set('nl-prefs', { name: ui.prefs.name, token: ui.prefs.token, muted: ui.muted }); }
function makeCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; for (let i = 0; i < 5; i++) c += A[Math.floor(Math.random() * A.length)]; return c; }

async function createRoom() {
  if (!onlineOK()) return;
  const me = readMe();
  if (!me.name || me.name === 'Player') { toast('Type your name first.', true); $('#myName') && $('#myName').focus(); return; }
  const code = makeCode();
  let s = newGame({ mode: 'online', code, hostId: ui.me, settings: ui.createSettings });
  s = reduce(s, { type: 'join', by: ui.me, actor: ui.me, name: me.name, token: me.token }).state;
  try {
    await ui.db.doc('games/' + code).set(s);
    await enterRoom(code);
  } catch (e) { toast(dbErr(e), true); }
}
async function joinRoom(code) {
  if (!onlineOK()) return;
  code = String(code || '').trim().toUpperCase();
  if (!/^[A-Z0-9]{4,6}$/.test(code)) { toast('Type the 5-letter room code.', true); return; }
  const me = readMe();
  try {
    const snap = await ui.db.doc('games/' + code).get();
    if (!snap.exists) { toast('No room with that code.', true); return; }
    const s = snap.data();
    if (s.status === 'lobby' && !s.playerIds.includes(ui.me)) {
      if (!me.name || me.name === 'Player') { toast('Type your name first.', true); $('#myName') && $('#myName').focus(); return; }
      if (s.players.length >= s.settings.maxPlayers) { toast('That room is full.', true); return; }
      ui.gameRef = ui.db.doc('games/' + code); ui.lockRef = ui.db.doc('locks/' + code);
      const r = await onlineDispatch({ type: 'join', by: ui.me, name: me.name, token: me.token });
      if (r && r.error) { toast(r.error, true); return; }
    }
    await enterRoom(code);
  } catch (e) { toast(dbErr(e), true); }
}
function dbErr(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') return 'You do not have permission to play online here. Ask for edit access.';
  if (c === 'quota_exceeded') return 'Online storage for this game is full.';
  return 'Could not reach the game server. Try again.';
}
async function enterRoom(code) {
  stopOnline();
  ui.mode = 'online'; ui.code = code; ui.state = null; ui.shown = null;
  ui.view = { pos: {}, dice: [3, 4], rollSeq: -1, fxSeq: -1, cardSeq: -1, winShown: null, first: true };
  ui.actor = null; ui.draft = null; ui.tab = 'props';
  ui.gameRef = ui.db.doc('games/' + code); ui.lockRef = ui.db.doc('locks/' + code);
  LS.set('nl-last-room', code);
  app().innerHTML = `<section class="page screen"><div class="note">Opening room ${esc(code)}…</div></section>`;
  ui.unsub = ui.gameRef.onSnapshot(snap => {
    if (!snap.exists) { toast('This room no longer exists.', true); stopOnline(); LS.del('nl-last-room'); showHome(); return; }
    const s = snap.data();
    if (ui.state && s.seq < ui.state.seq) return;
    if (ui.state && s.seq === ui.state.seq && s.updatedAt === ui.state.updatedAt) return;
    setState(s);
  }, err => { toast('Lost connection to the room. Reopen it to continue.', true); });
}
function stopOnline() {

}
async function onlineDispatch(a) {
  const holder = ui.me + ':' + TAB_ID;
  for (let i = 0; i < 14; i++) {
    try { const r = await ui.lockRef.acquire({ holder, ttlMs: 1200 }); if (r.acquired) break; }
    catch (e) { break; }
    await sleep(140 + Math.random() * 200);
  }
  const snap = await ui.gameRef.get();
  if (!snap.exists) return { error: 'Room not found.' };
  const res = reduce(snap.data(), Object.assign({}, a, { actor: ui.me, now: Date.now() }));
  if (res.error) return res;
  await ui.gameRef.set(res.state);
  return res;
}

/* ---------------- dispatch ---------------- */
async function dispatch(a, quiet) {
  if (!ui.state) return;
  if (ui.mode === 'local') {
    const r = reduce(ui.state, Object.assign({}, a, { now: Date.now() }));
    if (r.error) { if (!quiet) toast(r.error, true); return r; }
    setState(r.state); return r;
  }
  if (!quiet) { ui.sending = true; renderCenter(); }
  try {
    const r = await onlineDispatch(a);
    if (r && r.error) { if (!quiet) toast(r.error, true); }
    else if (r && r.state && (!ui.state || r.state.seq > ui.state.seq)) setState(r.state);
    return r;
  } catch (e) { if (!quiet) toast(dbErr(e), true); return { error: 'network' }; }
  finally { if (!quiet) { ui.sending = false; renderCenter(); } }
}

/* =====================================================================
   STATE → SCREEN
   ===================================================================== */
function setState(s) {
  ui.state = s;
  if (ui.mode === 'local') LS.set('nl-local', s);
  if (ui.processing) { ui.pendingState = s; return; }
  process(s);
}
async function process(s) {
  ui.processing = true;
  try {
    await applyState(s);
  } catch (e) { console.error(e); }
  ui.processing = false;
  if (ui.pendingState) { const n = ui.pendingState; ui.pendingState = null; return process(n); }
  drive();
}

async function applyState(s) {
  if (s.status === 'lobby' && ui.mode === 'online') { ui.shown = s; renderLobby(s); return; }
  if (ui.screen !== 'game' || !$('#game') || $('#game').dataset.board !== s.settings.board) buildGameScreen(s);
  const prev = ui.shown; ui.shown = s;
  const V = ui.view;
  const first = !prev || V.first;
  V.first = false;
  if (first) {
    s.players.forEach(p => V.pos[p.id] = p.pos);
    V.dice = s.dice; V.rollSeq = s.rollSeq; V.fxSeq = s.fx.seq; V.cardSeq = s.cardSeq || 0;
    renderAll(s); setDice($('#game'), V.dice, V.rollSeq);
    if (s.status === 'ended') V.winShown = s.winner;
    return;
  }
  const prevTurn = prev && prev.order[prev.turn];
  if (prev && prev.chat && s.chat.length > prev.chat.length && ui.tab !== 'log') ui.unread++;
  if (s.fx && s.fx.seq !== V.fxSeq) {
    V.fxSeq = s.fx.seq;
    if (s.rollSeq !== V.rollSeq) {
      V.rollSeq = s.rollSeq; V.dice = s.dice;
      ui.animating = true; renderCenter(); setDice($('#game'), V.dice, V.rollSeq);
      sound('dice'); await sleep(950);
    }
    if (s.fx.moves && s.fx.moves.length) {
      ui.animating = true; renderCenter();
      for (const m of s.fx.moves) await animateMove(s, m);
    }
    (s.fx.pays || []).forEach(pm => {
      if (pm.from) floatMoney(s, pm.from, -pm.amt);
      if (pm.to) floatMoney(s, pm.to, pm.amt);
    });
    if ((s.fx.pays || []).length) sound((s.fx.pays || []).some(pm => pm.to === ui.me) ? 'cash' : 'tick');
  }
  s.players.forEach(p => V.pos[p.id] = p.pos);
  ui.animating = false;
  renderAll(s);
  if ((s.cardSeq || 0) !== V.cardSeq && s.card) { V.cardSeq = s.cardSeq; showCard(s.card); }
  const nowTurn = s.order[s.turn];
  if (nowTurn !== prevTurn && s.status === 'playing' && (ui.mode === 'local' ? !P(s, nowTurn).bot : nowTurn === ui.me)) sound('turn');
  if (s.status === 'ended' && V.winShown !== s.winner) { V.winShown = s.winner; showWinner(s); }
}

async function animateMove(s, m) {
  const V = ui.view;
  if (m.direct) { V.pos[m.pid] = m.to; placeTokens(s); await sleep(450); return; }
  const n = buildBoard(s.settings.board).n;
  V.pos[m.pid] = m.from;
  const dir = m.steps > 0 ? 1 : -1;
  const count = Math.abs(m.steps);
  const per = count > 14 ? 90 : 165;
  for (let k = 0; k < count; k++) {
    V.pos[m.pid] = ((V.pos[m.pid] + dir) % n + n) % n;
    placeTokens(s, m.pid); sound('tick');
    await sleep(per);
  }
  await sleep(120);
}

function renderBoardState(s) {
  const board = $('#boardWrap .board'); if (!board) return;
  const b = buildBoard(s.settings.board);
  b.tiles.forEach(t => {
    const el = $(`.tile[data-i="${t.i}"]`, board); if (!el) return;
    const pr = s.props[t.i];
    const owner = pr && P(s, pr.owner);
    el.classList.toggle('owned', !!owner);
    el.classList.toggle('mort', !!(pr && pr.mort));
    if (owner) el.style.setProperty('--own', owner.color); else el.style.removeProperty('--own');
    const o = $('.own', el); if (o) o.hidden = !owner;
    const hs = $('.hs', el);
    if (hs) { const h = pr ? pr.houses : 0; const html = h === 5 ? '<i class="hotel"></i>' : '<i class="house"></i>'.repeat(h); if (hs.innerHTML !== html) hs.innerHTML = html; }
  });
  const pot = $('[data-pot]', board);
  if (pot) pot.textContent = s.settings.vacationCash ? fmt(s.pot) : 'Free party';
}

function placeTokens(s, movingId) {
  const board = $('#boardWrap .board'); if (!board) return;
  const b = buildBoard(s.settings.board), W = b.k + 2 * C_UNITS;
  const groups = {};
  s.players.forEach(p => {
    if (p.bankrupt) return;
    const pos = ui.view.pos[p.id] != null ? ui.view.pos[p.id] : p.pos;
    const jailed = p.inJail && pos === b.jail && movingId !== p.id;
    const key = pos + (jailed ? 'j' : '');
    (groups[key] = groups[key] || []).push(p);
  });
  const curId = s.status === 'playing' ? s.order[s.turn] : null;
  s.players.forEach(p => {
    const el = $(`.token[data-pid="${p.id}"]`, board);
    if (!el) return;
    el.hidden = p.bankrupt;
    if (p.bankrupt) return;
    const pos = ui.view.pos[p.id] != null ? ui.view.pos[p.id] : p.pos;
    const jailed = p.inJail && pos === b.jail && movingId !== p.id;
    const g = groups[pos + (jailed ? 'j' : '')];
    const idx = g.indexOf(p), n = g.length;
    const pl = tilePlace(pos, b.k);
    let x = pl.x, y = pl.y;
    if (pl.side === 'corner') {
      if (jailed) { x += .3; y -= .3; }
      else if (pos === b.jail) { x -= .45; y += .45; }
    } else {
      const inward = { b: [0, -.12], t: [0, .12], l: [.12, 0], r: [-.12, 0] }[pl.side];
      x += inward[0]; y += inward[1];
    }
    if (n > 1) {
      const ang = (idx / n) * Math.PI * 2 - Math.PI / 2, rad = n > 4 ? .3 : .22;
      x += Math.cos(ang) * rad; y += Math.sin(ang) * rad;
    }
    el.style.left = (x / W * 100) + '%';
    el.style.top = (y / W * 100) + '%';
    el.classList.toggle('cur', p.id === curId && !ui.animating);
    el.classList.toggle('me', ui.mode === 'online' && p.id === ui.me);
    el.title = p.name;
  });
}

function floatMoney(s, pid, amt) {
  const tok = $(`#boardWrap .token[data-pid="${pid}"]`);
  if (!tok || tok.hidden) return;
  const f = document.createElement('div');
  f.className = 'float ' + (amt >= 0 ? 'plus' : 'minus');
  f.textContent = (amt >= 0 ? '+' : '') + fmt(amt);
  f.style.left = tok.style.left; f.style.top = tok.style.top;
  tok.parentNode.appendChild(f);
  setTimeout(() => f.remove(), 1700);
}

function showCard(card) {
  const pop = $('#cardpop'); if (!pop) return;
  const c = CARDS[card.deck][card.idx];
  pop.innerHTML = `<div class="gcard ${card.deck}" role="status"><div class="dk">${card.deck === 'wahala' ? 'WAHALA' : 'AJO'}</div><p>${esc(c.text)}</p></div>`;
  pop.hidden = false; sound('card');
  clearTimeout(ui.cardT);
  ui.cardT = setTimeout(() => { pop.hidden = true; }, 4200);
  pop.onclick = () => { pop.hidden = true; };
}

/* who is acting in this browser */
function controls(pid) {
  const s = ui.state; if (!s) return false;
  const p = P(s, pid); if (!p || p.bankrupt) return false;
  if (ui.mode === 'local') return !p.bot;
  return pid === ui.me;
}
function actorId() {
  const s = ui.state;
  if (ui.mode === 'online') return P(s, ui.me) ? ui.me : null;
  const c = cur(s);
  if (ui.actor && P(s, ui.actor) && !P(s, ui.actor).bankrupt && !P(s, ui.actor).bot) return ui.actor;
  if (c && !c.bot) return c.id;
  const h = s.players.find(p => !p.bot && !p.bankrupt);
  return h ? h.id : null;
}
function isHost() { return ui.mode === 'local' || (ui.state && ui.state.hostId === ui.me); }

function renderCenter() {
  const s = ui.state, el = $('#cmain'); if (!s || !el) return;
  const c = cur(s);
  const busy = ui.animating || ui.sending;
  let h = '';
  if (s.status === 'ended') {
    const w = P(s, s.winner);
    h = `<div class="c-status">🏆 ${esc(w ? w.name : '')} wins!</div><div class="c-actions">${isHost() ? `<button class="btn primary" data-act="rematch">Play again</button>` : ''}<button class="btn" data-act="leave">Home</button></div>`;
    el.innerHTML = h; return;
  }
  const mine = c && controls(c.id);
  const who = ui.mode === 'online' && c && c.id === ui.me ? 'Your turn' : `${esc(c ? c.name : '')}'s turn`;
  h += `<div class="c-status"><span style="color:${c ? c.color : '#fff'}">●</span> ${who}</div>`;

  h += hostBanner();
  if (s.auction) h += auctionHTML(s);
  else if (c && busy) h += `<div class="c-sub">${ui.sending ? 'Sending…' : 'Moving…'}</div>`;
  else if (c && c.bot && ui.mode === 'local') h += `<div class="c-sub">${esc(c.name.replace(' (bot)', ''))} is thinking…</div>`;
  else if (c && c.bot && ui.mode === 'online') h += `<div class="c-sub">${esc(c.name.replace(' (bot)', ''))} is thinking…${s.hostId !== ui.me ? ' (bots run on the host\'s screen)' : ''}</div>`;
  else if (!mine) h += `<div class="c-sub">${phaseText(s, c)}</div>`;
  else {
    const debt = c.cash < 0;
    if (debt) h += `<div class="c-sub" style="color:#FFD6D7;font-weight:800">You owe ${fmt(-c.cash)}. Sell buildings or mortgage property, then continue.</div>`;
    let btns = '';
    if (s.phase === 'roll') {
      if (c.inJail) {
        h += `<div class="c-sub">You're in Kirikiri (try ${c.jailTurns + 1} of 3).</div>`;
        btns += `<button class="btn primary" data-act="roll" ${debt ? 'disabled' : ''}>Roll for doubles</button>`;
        btns += `<button class="btn" data-act="payJail" ${c.cash < JAIL_FINE ? 'disabled' : ''}>Pay ${fmt(JAIL_FINE)} bail</button>`;
        if (c.jailCards.length) btns += `<button class="btn green" data-act="useJailCard">Use free card</button>`;
      } else btns += `<button class="btn primary big" data-act="roll" ${debt ? 'disabled' : ''}>${s.rollAgain ? 'Roll again' : 'Roll dice'}</button>`;
    } else if (s.phase === 'buy' && s.pending) {
      const t = T(s, s.pending.i);
      h += `<div class="c-sub">${esc(t.name)} is for sale.</div>`;
      btns += `<button class="btn primary" data-act="buy" ${c.cash < t.price ? 'disabled' : ''}>Buy for ${fmt(t.price)}</button>`;
      btns += `<button class="btn" data-act="decline">${s.settings.auction ? 'Auction it' : 'Pass'}</button>`;
      btns += `<button class="btn ghost small" data-deed="${t.i}">Details</button>`;
    } else if (s.phase === 'done') {
      btns += `<button class="btn primary big" data-act="endTurn" ${debt ? 'disabled' : ''}>End turn</button>`;
    }
    if (debt) btns += `<button class="btn ghost small" data-tab="props">Manage property</button>` + confirmBtn('bankrupt', 'Declare bankruptcy', 'btn danger small');
    h += `<div class="c-actions">${btns}</div>`;
  }
  if (s.settings.vacationCash && s.pot > 0) h += `<div class="c-pot">Owambe pot ${fmt(s.pot)}</div>`;
  el.innerHTML = h;
  $$('button', el).forEach(b => { if (busy && b.dataset.act && !b.dataset.bid) b.disabled = true; });
  updateAuctionBar();
}
function phaseText(s, c) {
  if (!c) return '';
  if (s.phase === 'buy' && s.pending) return `${esc(c.name)} is deciding on ${esc(T(s, s.pending.i).name)}.`;
  if (c.inJail) return `${esc(c.name)} is in Kirikiri.`;
  if (s.phase === 'done') return `${esc(c.name)} is finishing their turn.`;
  return `Waiting for ${esc(c.name)} to roll.`;
}
function auctionHTML(s) {
  const a = s.auction, t = T(s, a.i), lead = a.by && P(s, a.by);
  const bidders = ui.mode === 'local' ? s.players.filter(p => !p.bankrupt && !p.bot) : (P(s, ui.me) && !P(s, ui.me).bankrupt ? [P(s, ui.me)] : []);
  const steps = [10, 50, 100];
  return `<div class="auction" role="group" aria-label="Auction">
    <div class="ttl">AUCTION · ${esc(t.name)}</div>
    <div class="hi">${lead ? `${esc(lead.name)} leads with ${fmt(a.high)}` : `No bids yet · list price ${fmt(t.price)}`}</div>
    <div class="bar"><i id="aubar"></i></div>
    ${bidders.map(p => `<div class="bidrow">${bidders.length > 1 ? `<span class="who" style="color:${p.color}">${esc(p.name)}</span>` : ''}${steps.map(st => { const amt = a.high + st; return `<button class="btn small ${st === 10 ? 'primary' : ''}" data-bid="${amt}" data-by="${p.id}" ${amt > p.cash || a.by === p.id ? 'disabled' : ''}>${fmt(amt)}</button>`; }).join('')}</div>`).join('')}
    <button class="btn ghost small" data-deed="${t.i}" style="justify-self:center">Property details</button>
  </div>`;
}
function updateAuctionBar() {
  const s = ui.state, bar = $('#aubar');
  if (!s || !s.auction || !bar) return;
  const left = Math.max(0, s.auction.endsAt - Date.now());

function confirmBtn(act, label, cls) {

/* players list */

      return n ? `<i title="${GROUPS[g].name}: ${n} of ${tiles.length}" style="background:${GROUPS[g].color};width:${n === tiles.length ? 18 : 8}px"></i>` : '';
    }).join('');
    const others = ['transport', 'utility'].map(ty => { const n = countOwned(s, p.id, ty); return n ? `<span class="chip">${n} ${ty === 'transport' ? 'transport' : 'utility'}</span>` : ''; }).join('');
    const kick = ui.mode === 'online' && isHost() && p.id !== ui.me && !p.bankrupt && s.status === 'playing'
      ? `<button class="btn ghost small kick" data-confirm="kick:${p.id}">${ui.confirm === 'kick:' + p.id ? 'Confirm' : 'Remove'}</button>` : '';
    return `<div class="pl ${p.id === curId && s.status === 'playing' ? 'turn' : ''} ${p.bankrupt ? 'out' : ''}">

/* side panel */
function renderSide() {

function propsTab(s, me) {
  if (!me) return `<div class="empty">You are watching. Players' property shows on the board; tap any space for details.</div>`;
  const p = P(s, me);
  const mine = ownedBy(s, me);
  if (!mine.length) return `<div class="empty">${ui.mode === 'local' ? esc(p.name) + ' owns' : 'You own'} no property yet. Land on a space and buy it.</div>`;
  const isTurn = cur(s) && cur(s).id === me;
  const groups = {};
  mine.forEach(t => { const g = t.type === 'prop' ? t.group : t.type; (groups[g] = groups[g] || []).push(t); });
  const order = Object.keys(GROUPS).concat(['transport', 'utility']);
  return order.filter(g => groups[g]).map(g => {
    const info = GROUPS[g] || { name: g === 'transport' ? 'Transport' : 'Utilities', color: '#9aa0c8' };
    const full = GROUPS[g] && ownsGroup(s, me, g);
    return `<div class="group"><div class="gh"><i style="background:${info.color}"></i>${info.name}${full ? ' · full set' : ''}</div>
      ${groups[g].map(t => {
        const pr = s.props[t.i];
        const btns = [];
        if (t.type === 'prop' && full) {
          const be = buildCheck(s, me, t.i);
          btns.push(`<button class="btn small green" data-do="build" data-i="${t.i}" ${be || !isTurn || s.auction ? `disabled title="${esc(!isTurn ? 'Build on your turn' : be || '')}"` : ''}>${pr.houses === 4 ? 'Hotel' : 'House'} ${fmt(t.house)}</button>`);

        if (s.settings.mortgage) {
          if (pr.mort) btns.push(`<button class="btn small" data-do="unmortgage" data-i="${t.i}" ${unmortgageCheck(s, me, t.i) || !isTurn ? 'disabled' : ''}>Pay off ${fmt(unmortgageCost(t))}</button>`);
          else btns.push(`<button class="btn small ghost" data-do="mortgage" data-i="${t.i}" ${mortgageCheck(s, me, t.i) ? 'disabled' : ''}>Mortgage +${fmt(t.price / 2)}</button>`);
        }
        const status = pr.mort ? 'Mortgaged' : t.type === 'prop' ? (pr.houses === 5 ? 'Hotel' : pr.houses ? pr.houses + ' house' + (pr.houses > 1 ? 's' : '') : 'No buildings') : '';
        const rent = pr.mort ? 0 : rentFor(s, t.i, 7);
        return `<div class="prop"><div class="pn" data-deed="${t.i}">${esc(t.name)}<small>${status}${status ? ' · ' : ''}${t.type === 'utility' ? 'rent by dice' : 'rent ' + fmt(rent)}</small></div><div class="pa">${btns.join('')}</div></div>`;
      }).join('')}</div>`;
  }).join('');

function tradeTab(s, me) {
  if (s.status !== 'playing') return '<div class="empty">Trading opens once the game starts.</div>';
  if (!me) return '<div class="empty">Spectators cannot trade.</div>';
  const p = P(s, me);
  const others = s.players.filter(o => o.id !== me && !o.bankrupt);
  if (!ui.draft || ui.draft.from !== me) ui.draft = { from: me, to: (others[0] || {}).id, give: { cash: 0, props: [], cards: 0 }, get: { cash: 0, props: [], cards: 0 } };
  const d = ui.draft;
  if (!others.find(o => o.id === d.to)) d.to = (others[0] || {}).id;
  const o = P(s, d.to);
  const tradable = pid => ownedBy(s, pid).filter(t => !(t.type === 'prop' && groupHasHouses(s, t.group)));
  const col = (side, who) => {
    const off = d[side];
    const list = tradable(who.id);
    return `<div class="tcol"><span class="lbl">${side === 'give' ? 'You give' : esc(who.name) + ' gives'}</span>

      <div class="field"><label for="tc-${side}">Cash in ₦k (has ${fmt(who.cash)})</label><input class="input" type="number" min="0" step="10" id="tc-${side}" data-tc="${side}" value="${off.cash || ''}" placeholder="0"></div>
      ${who.jailCards.length ? `<label class="ck"><input type="checkbox" data-tcard="${side}" ${off.cards ? 'checked' : ''}>Get-out-of-Kirikiri card</label>` : ''}
    </div>`;
  };
  const offers = s.trades.filter(t => t.from === me || t.to === me || ui.mode === 'local');
  const offerList = offers.map(t => {
    const a = P(s, t.from), b = P(s, t.to);
    const items = (off, who) => [off.cash ? fmt(off.cash) : '', ...off.props.map(i => T(s, i).name), off.cards ? 'Get-out-of-Kirikiri card' : ''].filter(Boolean).map(x => `<li>${esc(x)}</li>`).join('') || '<li>Nothing</li>';
    const canAnswer = ui.mode === 'local' ? controls(t.to) : t.to === me;
    const canCancel = ui.mode === 'local' ? controls(t.from) : t.from === me;
    return `<div class="offer ${canAnswer ? 'in' : ''}"><b>${esc(a.name)} → ${esc(b.name)}</b>
      <div class="tcols"><div><span class="lbl">${esc(a.name)} gives</span><ul>${items(t.give)}</ul></div><div><span class="lbl">${esc(b.name)} gives</span><ul>${items(t.get)}</ul></div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${canAnswer ? `<button class="btn small primary" data-trade="tradeAccept" data-id="${t.id}" data-by="${t.to}">${ui.mode === 'local' ? esc(b.name) + ' accepts' : 'Accept'}</button><button class="btn small" data-trade="tradeDecline" data-id="${t.id}" data-by="${t.to}">Decline</button>` : ''}
      ${canCancel && !canAnswer ? `<button class="btn small ghost" data-trade="tradeDecline" data-id="${t.id}" data-by="${t.from}">Cancel offer</button>` : ''}</div></div>`;
  }).join('');
  if (!o) return `<div class="empty">No one left to trade with.</div>` + offerList;
  return `<div class="trade">
    ${offerList ? `<span class="lbl">Offers</span>${offerList}` : ''}
    <span class="lbl">New offer</span>
    <div class="field"><label for="tradeTo">Trade with</label><select class="input" id="tradeTo">${others.map(x => `<option value="${x.id}" ${x.id === d.to ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
    <div class="tcols">${col('give', p)}${col('get', o)}</div>

}

/* =====================================================================
   DRIVER: bots and auction timers
   ===================================================================== */
function drive() {
  clearTimeout(ui.auT); clearTimeout(ui.botT);
  const s = ui.state;
  if (!s || s.status !== 'playing' || ui.processing) return;
  const iDrive = ui.mode === 'local' || s.hostId === ui.me;
  const now = Date.now();
  if (s.auction) {
    const due = s.auction.endsAt - now;
    const c = cur(s);
    const mayEnd = iDrive || (c && c.id === ui.me) || due < -3500;
    if (due <= 0 && mayEnd) {
      if (ui.endingAuction !== s.auction.seq) {
        ui.endingAuction = s.auction.seq;
        dispatch({ type: 'auctionEnd', by: ui.me }, true).then(r => { if (r && r.error) { ui.endingAuction = null; ui.auT = setTimeout(drive, 800); } });
      }
    } else ui.auT = setTimeout(drive, Math.max(250, Math.min(due + 120, 1200)));
  }
  if (!iDrive) return;
  for (const b of s.players.filter(p => p.bot && !p.bankrupt)) {
    const a = botAction(s, b.id);
    if (!a) continue;
    const delay = a.type === 'bid' ? 900 + Math.random() * 1400 : a.type === 'roll' ? 900 : 750;
    const seq = s.seq;
    ui.botT = setTimeout(() => { if (ui.state && ui.state.seq === seq) dispatch(a, true); }, delay);
    return;
  }
}
